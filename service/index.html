<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Hub</title>
<link rel="icon" type="image/png" href="../shared/mje-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<link rel="stylesheet" href="../shared/mje.css?v=20261020">
<style>
/* Service Hub only — everything shared with the Safety Hub is in ../shared/mje.css */
.brsel{background:#2b3640;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 8px;font:inherit;font-size:13px;max-width:170px}
.brsel option{color:#111;background:#fff}
.brpill{font-size:12px;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:2px 8px;color:#fff;white-space:nowrap}
.rolepill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:1px 6px;color:#fff}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#4ade80}
.sync.off::before{background:#fbbf24}
.sync.err::before{background:#f87171}
.viewas{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.viewas .grow{flex:1}
.todo{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.todo b{color:var(--text)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
table.setup{min-width:0}
main.tech{max-width:640px}
.list li > .pill{align-self:flex-start}
.kpi.k-cust{--kc:var(--muted)}
table.roles input,table.roles select{width:100%;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text)}
table.roles tr.dirty td{background:var(--warn-bg)}
table.roles tbody tr{cursor:default}
.banner a{color:inherit}
table.qlines{min-width:980px}
table.qlines td{vertical-align:middle;padding:6px 8px}
table.qlines tbody tr{cursor:default}
table.qlines input,table.qlines select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 7px;color:var(--text)}
table.qlines select[data-f=LabourRateCode]{margin-bottom:4px}
table.qlines input.num{text-align:right;width:96px}
table.qlines input.unit{width:72px}
table.qlines select[data-f=LineKind]{width:92px}
table.qlines select[data-f=TaxCode]{width:78px}
table.qlines tr.txt td,table tr.txt td{background:var(--grey-bg)}
.btn.sm{padding:3px 8px;font-size:12px}
.rowbtns{display:inline-flex;gap:3px;white-space:nowrap}
.qtotals{margin:12px 0 0 auto;max-width:380px}
.qtotals div{display:flex;justify-content:space-between;gap:16px;padding:4px 2px}
.qtotals .g{border-top:2px solid var(--text);font-weight:700;font-size:16px;margin-top:4px;padding-top:8px}
label.chk span{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px}
label.chk input{width:auto}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:4px 0 16px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs a.on{color:var(--text);border-bottom-color:var(--c-job)}
.tabs a span{background:var(--grey-bg);color:var(--muted);border-radius:999px;padding:0 7px;font-size:11px;margin-left:3px}
.tabs a:hover{color:var(--text)}
tr.muted td{opacity:.55}
select.qs{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--text);font-size:12px}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.hist{background:var(--surface2);color:var(--muted);border:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.assetpick{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label.apick{display:flex;gap:6px;align-items:center;color:var(--text);font-size:13px;cursor:pointer}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--grey-bg)}
#dlgBody > .btn.danger{margin-top:4px}
.seg button{font-size:13px;padding:6px 12px}
.stitle{font-size:14px;margin-left:4px}
#sdate{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color-scheme:light dark}
.sched{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.sgrid{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:0 0 4px}
.shelp{margin-top:8px}
.sname{font-weight:600;font-size:13px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);background:var(--surface);color:var(--text)}
.sname span{font-weight:400;color:var(--muted);font-size:11px}
.dv{min-width:980px}
.dv-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line)}
.dv-head{position:sticky;top:0;z-index:2;background:var(--surface2)}
.dv-hours{position:relative;height:28px}
.dv-hours span{position:absolute;top:7px;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.dv-hours span:first-child{transform:none}.dv-hours span:last-child{transform:translateX(-100%)}
.dv-lane{position:relative;cursor:copy;background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100% / 14))}
.dv-lane .now{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);z-index:1;pointer-events:none}
.blk,.wblk{background:var(--surface2);border:1px solid var(--c-job);border-left:4px solid var(--c-job);border-radius:6px;font-size:11.5px;line-height:1.3;color:var(--text);cursor:grab;overflow:hidden}
.blk{position:absolute;padding:3px 9px 3px 6px;white-space:nowrap;text-overflow:ellipsis;z-index:1}
.blk .t,.wblk .t{color:var(--muted)}
.blk .rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:linear-gradient(to right,transparent,rgba(127,127,127,.25))}
.blk.p-high,.wblk.p-high,.ucard.p-high{border-left-color:var(--bad)}
.blk.p-urgent,.wblk.p-urgent,.ucard.p-urgent{border-left-color:var(--crit)}
.blk.warn,.wblk.warn{background:var(--warn-bg)}
.blk.clash,.wblk.clash{border-color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit)}
.wv{display:grid;grid-template-columns:140px repeat(7,minmax(100px,1fr));min-width:840px}
.wh{position:sticky;top:0;z-index:2;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.wh.today{color:var(--info)}
.wcell{min-height:74px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:4px;cursor:copy}
.wcell.today{background:var(--info-bg)}.wcell.wkend,.wh.wkend{background:var(--grey-bg)}
.wblk{padding:3px 6px}
.over{outline:2px dashed var(--c-job);outline-offset:-2px;background-color:var(--info-bg) !important}
.upanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.upanel input[type=search]{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.ulist{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.ucard{border:1px solid var(--line);border-left:4px solid var(--c-job);border-radius:8px;padding:8px 10px;background:var(--surface2);cursor:grab;font-size:13px;display:flex;flex-direction:column;gap:3px}
.ucard:active,.blk:active,.wblk:active{cursor:grabbing}
.ucard .clip div{-webkit-line-clamp:2}
.lg{display:inline-block;width:14px;height:10px;border-radius:2px;border:1px solid var(--c-job);border-left:4px solid var(--c-job)}
.lg.p-high{border-left-color:var(--bad)}.lg.p-urgent{border-left-color:var(--crit)}.lg.clash{border-color:var(--crit)}.lg.warn{background:var(--warn-bg)}
@media (max-width:1000px){.sched{grid-template-columns:1fr}.upanel{position:static;max-height:none}}
#printArea{display:none}
@media print{ body > *:not(#printArea){display:none !important} #printArea{display:block} body{background:#fff} @page{margin:12mm} }
.gpscell{justify-content:flex-end}.gpscell .btn{padding:8px 12px;white-space:nowrap}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}.crumbs a{color:inherit}
tr[data-go],tr[data-edit]{cursor:pointer}
.kv a{color:var(--info)}
.list li > .mono{text-align:right}
nav button{white-space:nowrap}
a.btn{color:inherit;text-decoration:none;display:inline-block}
@media (max-width:720px){ .who .nm{display:none} }
/* ---- My Jobs (technician, phone first) ---- */
.mysec{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
.myday{font-size:13px;margin:12px 0 6px;color:var(--text)}
.mycard{display:block;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c-job);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;color:var(--text);text-decoration:none;box-shadow:var(--shadow)}
.mycard:active{background:var(--surface2)}
.mycard.p-high,.myhead.p-high{border-left-color:var(--bad)}.mycard.p-urgent,.myhead.p-urgent{border-left-color:var(--crit)}
.mc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mc-top .grow{flex:1}.mc-top .big{font-size:20px}
.mc-site{margin-top:4px;font-size:14px}.mc-desc{margin-top:4px;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.myhead{border-left:4px solid var(--c-job)}
.myact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn.big{padding:12px 16px;font-size:16px;flex:1 1 auto;text-align:center;min-height:48px}
.timerbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-bg);color:var(--text);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.timerbar .grow{flex:1}
main.tech .card{margin-bottom:12px}main.tech .empty{padding:10px 6px}.mysec .count{text-transform:none;letter-spacing:0;font-size:12px}main.tech .card .bar{margin-bottom:6px}main.tech .card h3{margin:0}
.btn.mic.on{background:var(--crit);border-color:var(--crit);color:#fff}
.cq{padding:8px 0;border-bottom:1px solid var(--line)}.cq:last-child{border-bottom:0}.cqt{margin-bottom:6px}.cqt .req::after{content:" *";color:var(--crit)}
.cq textarea,.cq input:not([type=radio]){width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--text)}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.yn label{display:block}.yn input{position:absolute;opacity:0;pointer-events:none}
.yn span{display:block;padding:9px 18px;cursor:pointer;background:var(--surface);border-right:1px solid var(--line);font-weight:600;min-width:58px;text-align:center}
.yn label:last-child span{border-right:0}
.yn input:checked + span{background:var(--c-job);color:#fff}.yn input[value=No]:checked + span{background:var(--crit)}
.yn input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
.ynnote{margin-top:6px}
.sigwrap{position:relative;border:2px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;margin-top:8px}
.sigwrap canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.sigwrap .sighint{position:absolute;left:12px;bottom:8px;color:#9aa3ae;font-size:13px;pointer-events:none}
.sigwrap.inked .sighint{display:none}.sigwrap.off{opacity:.35}
.ph .phw{position:absolute;left:4px;bottom:4px;background:var(--warn);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.ph .phf{width:110px;height:110px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;background:var(--grey-bg);color:var(--text)}
.sync[role=button]:hover{text-decoration:underline}
@media (max-width:720px){ main.tech{padding:12px} main.tech .bar h2{font-size:20px} }
.kpi.k-po{--kc:#0f766e}#dlg.f-po{--fc:#0f766e;--fc-bg:#ecf8f5}
@media (prefers-color-scheme:dark){ .kpi.k-po{--kc:#2dd4bf} #dlg.f-po{--fc:#2dd4bf;--fc-bg:#10241f} }
table.rcv{min-width:0}table.rcv input.num{width:90px}
/* eight menu items: below 1400 px the menu moves to its own row instead of pushing the page sideways */
@media (max-width:1400px){ header{flex-wrap:wrap} header nav{order:3;width:100%;margin:0;overflow:auto} }
</style>

  <div class="logo"><span class="chip"><img data-brand="logo" alt=""></span><span id="apps"></span></div>

  <div class="who" id="who"></div>
</header>

<dialog id="dlg"><form method="dialog" id="frm" novalidate>
  <div class="dh"><span class="dlg-logo"><img id="dlgLogo" alt=""></span><div class="dt"><span class="kind" id="dlgKind"></span><h2 id="dlgTitle"></h2></div><button type="button" class="btn" id="dlgX" aria-label="Close">✕</button></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><button type="button" class="btn" id="dlgCancel">Cancel</button><button type="submit" class="btn primary" id="dlgSave">Save</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script src="../shared/mje-config.js?v=20261021"></script>
<script src="../shared/mje-core.js?v=20261021"></script>
<script>
/* =====================================================================
   MJE Service Hub — quote → job → schedule → field completion → invoice
   The Microsoft 365 connection (CLIENT_ID, TENANT_ID, SP_HOST, SITE_PATH)
   is in ../shared/mje-config.js, shared with the Safety Hub.
   This repo is public: no customer names, register data or seed data here.
   ===================================================================== */
const CONFIG = {
  ...MJE_TENANT,
  // List names = BRAND.LIST_PREFIX (mje-config.js) + these, e.g. MJE_Customers
  LISTS: mjeLists({
    customers:"Customers", sites:"Sites", assets:"CustomerAssets",
    quotes:"Quotes", qlines:"QuoteLines",
    jobs:"Jobs", assign:"JobAssignments", time:"TimeEntries", mat:"JobMaterials", notes:"JobNotes",
    comp:"JobCompletions", chk:"Checklists", resp:"ChecklistResponses", files:"JobFiles",
    inv:"Invoices", iline:"InvoiceLines", pay:"InvoicePayments", sync:"MyobSync",
    rates:"LabourRates", settings:"ServiceSettings", numbers:"ServiceNumbers", supp:"Suppliers", prod:"Products", contacts:"Contacts", po:"PurchaseOrders", poline:"PurchaseOrderLines",
    // Safety Hub lists the Service Hub reads
    staff:"Staff", trn:"Training", course:"Courses", tt:"TestTag", risk:"Risks", inc:"Incidents",
  }),
  // Sign-in asks only for what the Safety Hub already has; Mail.Send.Shared is requested when a quote/invoice is first emailed.
  SCOPES: ["Sites.ReadWrite.All", "User.Read"],
};
const DEMO = CONFIG.CLIENT_ID.startsWith("<<");

const LIST_INFO = {
  customers:"Customers (billing entities)", sites:"Service sites", assets:"Customer equipment", quotes:"Quotes", qlines:"Quote lines",
  jobs:"Jobs", assign:"Technician bookings", time:"Time entries", mat:"Job materials", notes:"Job notes & photos", comp:"Job completions",
  chk:"Checklist templates", resp:"Checklist answers", files:"Job files library", inv:"Invoices", iline:"Invoice lines", pay:"Payments",
  sync:"MYOB sync queue", rates:"Labour rates", settings:"Service settings", numbers:"Number counters", supp:"Suppliers", prod:"Products (stock catalogue)", contacts:"Customer contacts", po:"Purchase orders", poline:"Purchase order lines",
  staff:"Staff (Safety Hub)", trn:"Training records (Safety Hub)", course:"Courses (Safety Hub)", tt:"Test & tag (Safety Hub)",
  risk:"Risk registers (Safety Hub)", inc:"Incidents (Safety Hub)" };
const SAFETY_KEYS = ["staff","trn","course","tt","risk","inc"];

/* ---------------- screens & who sees them ---------------- */
const OFFICE = ["Admin","Office"], TECH = ["Technician"];
const CUST_LOAD = ["customers","sites","assets","jobs","quotes","sync","settings","comp","time","assign","contacts"];
const ROUTES = {
  dash:      { label:"Dashboard",         roles:OFFICE, lists:["jobs","assign","quotes","inv","comp","time","mat","rates"], load:["jobs","assign","quotes","inv","comp","time","mat","rates","settings"], step:"Dashboard — jobs by status, today's schedule, unscheduled jobs, quotes pending approval, completed-not-invoiced value, overdue jobs" },
  customers: { label:"Customers & Sites", roles:OFFICE, lists:["customers","sites","assets"], load:CUST_LOAD, step:"Customers & Sites — search, create and edit; each site shows its equipment and full job history" },
  quotes:    { label:"Quotes",            roles:OFFICE, lists:["quotes","qlines","rates","numbers"], load:["quotes","qlines","rates","settings","customers","sites","jobs","prod","contacts"], step:"Quotes — labour and parts lines, GST, print/PDF, email, follow-up list, Convert to Job" },
  jobs:      { label:"Job Centre",        roles:OFFICE, lists:["jobs","assign","time","mat","notes","comp","resp","numbers"], load:["jobs","assign","time","mat","notes","comp","resp","chk","inv","customers","sites","assets","rates","settings","quotes","trn","tt","inc","supp","prod","contacts","po"], step:"Job Centre — filterable job grid and the job page (Details, Schedule, Time, Materials, Notes & Photos, Checklists, Safety, Purchases, Invoice)" },
  purchases: { label:"Purchasing",        roles:OFFICE, lists:["po","poline","supp","numbers"], load:["po","supp","prod","jobs","settings","customers","sites"], step:"" },
  schedule:  { label:"Scheduler",         roles:OFFICE, lists:["jobs","assign","staff"], load:["jobs","assign","time","comp","customers","sites","settings","trn","tt"], step:"Scheduler — one row per technician, day and week views, drag and drop, clash warnings" },
  invoices:  { label:"Invoicing",         roles:OFFICE, lists:["inv","iline","pay","sync","numbers"], step:"Invoicing — invoices from completed jobs, deposits, progress, credit notes, payments, Send to MYOB" },
  settings:  { label:"Settings",          roles:OFFICE, lists:["settings","rates","numbers","chk"], load:["settings","rates"], step:"" },
  timesheet: { label:"Day timesheet",     roles:OFFICE, nav:false, lists:["time"], load:["time","jobs","rates","settings","assign"], step:"" },
  suppliers: { label:"Suppliers",         roles:OFFICE, nav:false, lists:["supp"], load:["supp","settings"], step:"" },
  products:  { label:"Products",          roles:OFFICE, nav:false, lists:["prod"], load:["prod","supp","settings"], step:"" },
  site:      { label:"Site",              roles:OFFICE, nav:false, lists:["customers","sites","assets"], load:CUST_LOAD, step:"" },
  my:        { label:"My Jobs",           roles:TECH,   lists:["jobs","assign","time","mat","notes","comp","resp","chk"], soft:true,
               load:["jobs","assign","time","mat","notes","comp","resp","chk","sites","customers","assets","settings","rates","trn","tt","prod"], step:"My Jobs — today and upcoming, site map link, timer with GPS, materials, notes, photos, checklists, signature, mark complete — works offline" },
};

/* ---------------- state ---------------- */
const S = { have:new Set(), staff:[], me:null, role:"", roleSource:"", viewAs:"", route:"", param:"", branch:"" };

/* ---------------- role detection ----------------
   The role only decides which screens open. SharePoint permissions still decide
   what each person can change (Owners / MJE Office / staff in Visitors).        */
function resolveRole(){
  const email = String(account?.username || "").trim().toLowerCase();
  S.me = email ? S.staff.find(s => String(s.Email || "").trim().toLowerCase() === email) || null : null;
  if (DEMO){ const r = new URLSearchParams(location.search).get("role"); return [["Admin","Office","Technician","None"].includes(r) ? r : "Admin", "demo"]; }
  if (S.me && ["Admin","Office","Technician","None"].includes(S.me.HubRole)) return [S.me.HubRole, "staff"];
  // First run: nobody has an office role yet, so let whoever signs in set things up
  if (!S.staff.some(s => OFFICE.includes(s.HubRole))) return ["Admin", "setup"];
  return ["None", S.me ? "norole" : "nomatch"];
}
const effRole = () => S.viewAs ? "Technician" : S.role;
const techName = () => S.viewAs || S.me?.Title || account?.name || "";
const technicians = () => S.staff.filter(s => s.StaffStatus !== "Left" && (s.HubRole === "Technician" || s.Department === "Service"))
  .map(s => s.Title).sort((a,b) => a.localeCompare(b));

/* ---------------- branches ----------------
   Port Moresby (head office, the first in Settings → Branches) and Lae. Staff see their own branch.
   Admins, staff marked "All branches" (Settings → Staff & roles) and anyone not in the staff list get a picker.
   This keeps each office's screens tidy; it is not a security barrier (the lists are shared on the site).
   Split by branch: jobs, quotes, bookings, purchase orders, the dashboard and Job Centre. Shared: customers, sites, suppliers, staff, rates.
   A job or quote with no branch counts as the head office. Technicians' My Jobs is never filtered. */
function branches(){
  const seen = new Set(pickList("Branches"));
  [S.staff, D.jobs || [], D.quotes || [], D.sites || []].forEach(a => a.forEach(r => { const b = String(r.Branch || "").trim(); if (b) seen.add(b); }));
  return [...seen];
}
const headOffice = () => branches()[0] || "";
const brOf = r => String(r?.Branch || "").trim() || headOffice();
const allBranchesOK = () => DEMO || !S.me || S.role === "Admin" || S.me.AllBranches === "Yes";
function applyBranchAccess(){
  if (!allBranchesOK()) { S.branch = branches().length ? brOf(S.me) : ""; return; }
  if (!applyBranchAccess.done){ applyBranchAccess.done = true; try { S.branch = localStorage.getItem(mjeStoreKey("mjeServiceBranch")) || ""; } catch {} }
  if (S.branch && !branches().includes(S.branch)) S.branch = "";
}
function inBranch(fn){
  if (!S.branch || S.route === "my" || S.viewAs) return fn();
  const keep = { jobs:D.jobs, quotes:D.quotes, assign:D.assign, po:D.po };
  try {
    if (D.jobs) D.jobs = keep.jobs.filter(j => brOf(j) === S.branch);
    if (D.po) D.po = keep.po.filter(p => brOf(p) === S.branch);

/* ---------------- data: each list is read once, then kept until Refresh ---------------- */
const D = {}, LOADING = {};
/* Lists that grow by thousands a year are read for a window only: the last LoadDays days (Settings, default 120)

   "Load all history" reads everything. S.win[k] holds the window start while D[k] is a window.          */
const WINDOW = { time:"EntryDate", mat:"EntryDate", notes:"NoteDate", comp:"CompletedDate", resp:"ResponseDate", assign:"AssignDate", inv:"InvoiceDate", po:"OrderDate" };

// Rows always read whatever their date: purchase orders still waiting for goods
const WINDOW_ALSO = { po: ["Draft","Sent","Part received"].map(st => `fields/POStatus eq '${st}'`) };
async function listWindow(k, filter){
  if (!filter || !WINDOW_ALSO[k]) return listItems(CONFIG.LISTS[k], filter);
  const parts = await Promise.all([filter, ...WINDOW_ALSO[k]].map(f => listItems(CONFIG.LISTS[k], f)));
  if (parts.some(r => r.filtered === false)) return parts.find(r => r.filtered === false);
  const seen = new Set(), out = []; parts.flat().forEach(r => { if (!seen.has(r.id)) { seen.add(r.id); out.push(r); } });
  out.filtered = true; return out;
}
S.win = {}; S.jobFull = new Set(); S.jobLoading = new Set(); S.history = ""; S.poRead = new Set();
const loadDays = () => { const n = Math.round(num(setting("LoadDays", 120))); return n >= 7 ? n : 120; };
const windowed = () => Object.keys(S.win).length > 0;
async function need(keys, soft){
  if (keys.includes("settings") && keys.some(k => WINDOW[k])) await need(["settings"], soft);   // LoadDays first
  const from = addDays(TODAY, -loadDays());

    if (D[k]) return null;
    if (DEMO || !S.have.has(CONFIG.LISTS[k])) { D[k] = []; return null; }       // not set up yet: treat as empty
    const filter = !S.history && WINDOW[k] ? `fields/${WINDOW[k]} ge '${from}'` : "";
    return LOADING[k] ||= listWindow(k, filter).then(r => { D[k] = r; delete LOADING[k]; if (r.filtered) S.win[k] = from; else delete S.win[k]; },
      e => { delete LOADING[k]; if (soft && (isForbidden(e) || isMissingList(e))) { D[k] = []; return; } throw e; });   // soft: staff can't read every list
  }));

/* ---------------- job rules (every screen uses these) ----------------
   Technicians never edit MJE_Jobs. A job's status is worked out from what has happened:
   valid completion record -> Completed; any time logged -> In Progress; any booking -> Scheduled; else New.
   On Hold, Invoiced and Cancelled are set by the office and always win.                              */
const JOB_STATUS = ["New","Scheduled","In Progress","On Hold","Completed","Invoiced","Cancelled"];
const OFFICE_STATUS = ["On Hold","Invoiced","Cancelled"];
const CLOSED = ["Completed","Invoiced","Cancelled"];
const PRIORITIES = ["Urgent","High","Normal","Low"];
const priRank = p => { const i = PRIORITIES.indexOf(p); return i < 0 ? 2 : i; };
const byUrgency = (a, b) => priRank(a.Priority) - priRank(b.Priority) || (a.DueDate || "9999").localeCompare(b.DueDate || "9999") || String(a.Title).localeCompare(String(b.Title), undefined, { numeric:true });
// A completion counts once it has a signature (or signed-by name) or a "customer not present" reason, and the office hasn't returned it
const validCompletion = c => c.ReviewStatus !== "Returned" && (!!(c.SignatureFile || c.SignedByName) || (c.CustomerNotPresent === "Yes" && !!c.NotPresentReason));
function jobFacts(){
  const f = new Map(), get = n => { if (!f.has(n)) f.set(n, { comp:null, time:false, booked:false }); return f.get(n); };
  (D.comp || []).filter(validCompletion).forEach(c => { const x = get(c.Title); if (!x.comp || (c.CompletedDate || "") > (x.comp.CompletedDate || "")) x.comp = c; });
  (D.time || []).forEach(t => { if (t.JobNo) get(t.JobNo).time = true; });
  (D.assign || []).forEach(a => { if (a.AssignStatus !== "Cancelled") get(a.Title).booked = true; });
  return f;
}
const ST_RANK = { New:0, Scheduled:1, "In Progress":2, Completed:3 };
// When only a window of time / completions / bookings is loaded, older records may be missing,
// so the worked-out status can only move a job forward from its saved status, never back.
const partialFacts = no => ["time","comp","assign"].some(k => S.win[k]) && !S.jobFull.has(no);
function jobState(j, facts){
  if (OFFICE_STATUS.includes(j.JobStatus)) return j.JobStatus;
  const x = facts.get(j.Title) || {};
  const got = x.comp ? "Completed" : x.time ? "In Progress" : x.booked ? "Scheduled" : "New";
  if (!partialFacts(j.Title)) return got;
  const was = j.JobStatus in ST_RANK ? j.JobStatus : "New";
  return ST_RANK[was] > ST_RANK[got] ? was : got;
}
// Office/Admin only: write the worked-out status back to MJE_Jobs so SharePoint views and exports stay true
let statusSyncDone = false;
async function syncJobStatuses(){
  if (DEMO || statusSyncDone || S.viewAs || !OFFICE.includes(S.role) || !D.jobs || !D.comp || !D.time || !D.assign) return;
  statusSyncDone = true;
  const facts = jobFacts();
  for (const j of D.jobs.filter(j => jobState(j, facts) !== (j.JobStatus || "New")).slice(0, 50)){
    const st = jobState(j, facts), f = { JobStatus: st };
    if (st === "Completed" && !j.CompletedDate) f.CompletedDate = facts.get(j.Title)?.comp?.CompletedDate || TODAY;
    if (st !== "Completed" && st !== "Invoiced" && j.CompletedDate) f.CompletedDate = null;
    try { await saveListItem(CONFIG.LISTS.jobs, j.id, f); Object.assign(j, f); }
    catch(e){ console.warn("Couldn't update the status of", j.Title, e.message); if (isForbidden(e)) break; }
  }
}
// Work done but not yet invoiced (ex GST). Fixed-price jobs: quoted amount; do & charge: billable time x rate + billable materials.
// Deposit and progress invoices already raised for the job are taken off.
const rateFor = code => (D.rates || []).find(r => r.RateCode && r.RateCode === code);
function unbilledValue(j){
  const no = j.Title;
  const billed = (D.inv || []).filter(i => i.JobNo === no && i.InvoiceStatus !== "Void" && ["Deposit","Progress"].includes(i.InvoiceType)).reduce((a, i) => a + num(i.SubtotalEx), 0);
  if (j.BillingBasis === "Fixed price (quoted)") return { value: Math.max(0, num(j.QuotedAmountEx) - billed), noRate: 0 };
  let value = 0, noRate = 0;
  (D.time || []).filter(t => t.JobNo === no && t.Billable !== "No" && !t.InvoiceNo).forEach(t => {
    const r = rateFor(t.LabourRateCode), h = num(t.BillableHours ?? t.ActualHours);
    if (!r) { noRate += h; return; }
    value += (!r.RateUnit || r.RateUnit === "Hour") ? h * num(r.RateEx) : num(r.RateEx);
  });
  (D.mat || []).filter(m => m.Title === no && m.Billable !== "No" && !m.InvoiceNo).forEach(m => value += num(m.Qty) * num(m.UnitSell));
  return { value: Math.max(0, value - billed), noRate };
}

/* =====================================================================
   MY JOBS — technician view, phone first.
   Works without signal: every change is put in a queue on the phone
   (IndexedDB, photos and signatures included) and sent when there is a
   connection. Each row carries a ClientRef made on the phone; before
   sending, the queue checks SharePoint for that ClientRef so a retry can
   never create a duplicate. The jobs themselves are kept on the phone
   (localStorage) so My Jobs opens with no signal.
   ===================================================================== */
const MY_LOAD = ROUTES.my.load;
const isNetErr = e => e instanceof TypeError || /failed to fetch|networkerror|load failed|network request failed/i.test(e?.message || "");
const myUser = () => String(account?.username || "demo").toLowerCase();
const myJobNos = () => new Set((D.assign || []).filter(a => a.Technician === techName() && a.AssignStatus !== "Cancelled").map(a => a.Title));
const myParam = () => S.param.split("/")[0];

/* ---------- the queue (IndexedDB, with an in-memory fallback) ---------- */
let QDB = null, QMEM = null, FLUSHING = false, FLUSH_T = null;
function qOpen(){
  if (QMEM) return Promise.resolve(null);
  return QDB ||= new Promise(res => {
    try { const r = indexedDB.open(mjeStoreKey("mje-service"), 1);
      r.onupgradeneeded = () => r.result.createObjectStore("queue", { keyPath:"qid", autoIncrement:true });
      r.onsuccess = () => res(r.result); r.onerror = () => { QMEM = []; res(null); }; }
    catch { QMEM = []; res(null); }
  });
}
const qReq = (mode, fn) => qOpen().then(db => db ? new Promise((res, rej) => { const st = db.transaction("queue", mode).objectStore("queue"), r = fn(st); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }) : null);
const qAll = async () => QMEM ? QMEM.slice() : ((await qReq("readonly", st => st.getAll())) || (QMEM ? QMEM.slice() : []));
const qAdd = async op => { if (QMEM) { op.qid = Date.now() + Math.random(); QMEM.push(op); return; } await qReq("readwrite", st => st.add(op)); };
const qPut = async op => { if (QMEM) return; await qReq("readwrite", st => st.put(op)); };
const qDel = async qid => { if (QMEM) { QMEM = QMEM.filter(o => o.qid !== qid); return; } await qReq("readwrite", st => st.delete(qid)); };
async function qMine(){ return (await qAll()).filter(o => o.user === myUser()); }
async function qCount(){ const ops = await qMine(); SYNC.waiting = ops.length; SYNC.error = ops.find(o => o.error)?.error || ""; showSync(); return ops; }

// Save a new row through the queue; it shows on screen straight away (marked "waiting to send")
async function queueSave(key, fields, opts = {}){
  const f = { ...fields, ClientRef: fields.ClientRef || newRef() };
  Object.keys(f).forEach(k => (f[k] === "" || f[k] == null) && delete f[k]);
  const local = { ...f, id:"local-" + f.ClientRef, _pending:true };
  if (opts.file?.blob) local._thumb = URL.createObjectURL(opts.file.blob);
  (D[key] ||= []).push(local);
  await qAdd({ user: myUser(), key, fields: f, file: opts.file || null, label: opts.label || key, created: new Date().toISOString(), tries:0, error:"" });
  await qCount(); flushSoon(300);
  return local;
}
const flushSoon = (ms = 1500) => { clearTimeout(FLUSH_T); FLUSH_T = setTimeout(flushQueue, ms); };

// A token without ever redirecting: offline or expired sign-in just stops the send
async function quietToken(){
  try { return (await msalApp.acquireTokenSilent({ scopes:CONFIG.SCOPES, account })).accessToken; }
  catch(e){ const err = new Error(isNetErr(e) || /network|timed_out|no_network/i.test(e.errorCode || e.message) ? "offline" : "signin"); err.kind = err.message; throw err; }
}
async function findByRef(key, ref){
  const j = await graph(`/sites/${siteId}/lists/${CONFIG.LISTS[key]}/items?$filter=fields/ClientRef eq '${ref}'&expand=fields&$top=1`,
    { headers:{ Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly" } });
  const it = j.value?.[0]; return it ? { id:it.id, ...it.fields } : null;
}
async function sendOp(op){
  const f = { ...op.fields };
  // Notes queued before 20 Oct 2026 used "Author" - SharePoint's own Created By column, which can't be written
  if (op.key === "notes" && "Author" in f){ f.NoteBy ??= f.Author; delete f.Author; }
  if (DEMO) return { ...f, id:"demo" + Date.now() + Math.random().toString(36).slice(2) };
  const found = await findByRef(op.key, f.ClientRef);
  if (found) return found;                                             // already there from an earlier try
  if (op.file?.blob){
    if (JOB_DRIVE === undefined) JOB_DRIVE = await libraryDrive(CONFIG.LISTS.files);
    if (!JOB_DRIVE) throw Object.assign(new Error(`the ${CONFIG.LISTS.files} library isn't set up`), { status:404 });
    const up = await uploadToDrive(JOB_DRIVE, op.file.folder, op.file.name, op.file.blob, op.file.type || "image/jpeg");
    f[op.file.field] = up.webUrl;
  }
  return saveListItem(CONFIG.LISTS[op.key], null, f);
}
async function flushQueue(){
  if (FLUSHING) return; FLUSHING = true;
  let sent = 0;
  try {
    const ops = await qMine(); if (!ops.length) return;
    if (!DEMO){
      if (!navigator.onLine || !siteId) return;
      try { await quietToken(); }
      catch(e){ if (e.kind === "signin"){ SYNC.error = "Sign in again to send your changes"; showSync(); } return; }
    }
    for (const op of ops){
      try {
        const saved = await sendOp(op);
        await qDel(op.qid); sent++;
        const list = D[op.key] || [], i = list.findIndex(x => x.ClientRef === op.fields.ClientRef);
        if (i >= 0) list[i] = { ...saved, _thumb: list[i]._thumb }; else list.push(saved);
      } catch(e){
        if (isNetErr(e)) break;                                       // lost the connection: try again later
        op.tries = (op.tries || 0) + 1; op.error = isForbidden(e) ? "SharePoint refused this change (no permission)" : e.message; await qPut(op);
      }
    }
  } finally {
    FLUSHING = false; await qCount();
    if (sent){ saveSnapshot(); if (S.route === "my") render(); toast(`${sent} change${sent === 1 ? "" : "s"} sent to SharePoint`); }
  }
}
window.addEventListener("online", () => flushSoon(500));
setInterval(() => { if (SYNC.waiting) flushSoon(0); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && SYNC.waiting) flushSoon(0); });

// Queue times are stored as an exact moment (UTC); show them in the phone's own time
const localStamp = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${fmtDate(ymd(d))} ${hhmm(d)}`; };
async function openSyncPanel(){
  const ops = await qMine();
  openDialog({ cls:"f-job", kind:"My Jobs · Sync", title: ops.length ? `${ops.length} change${ops.length === 1 ? "" : "s"} waiting to send` : "Everything has been sent", save: ops.length ? "Send now" : "Close",
    body: (ops.length ? `<ul class="list">${ops.map(o => `<li><span class="x"><b>${esc(o.label)}</b><br><span class="count">${esc(localStamp(o.created))}${o.tries ? ` · ${o.tries} tr${o.tries === 1 ? "y" : "ies"}` : ""}</span>${o.error ? `<br><span class="flag">${esc(o.error)}</span>` : ""}</span>
      <button type="button" class="btn sm danger" data-qdrop="${o.qid}">Discard</button></li>`).join("")}</ul>` : `<p class="count">Nothing is waiting on this phone.</p>`)
      + `<p class="count">${navigator.onLine ? "Changes are sent automatically when there's a connection." : "This phone is offline. Changes will be sent automatically when the connection is back."} Keep working as normal — nothing is lost if you close the app.</p>`,
    onSubmit: async () => {
      $("#dlg").close(); if (!ops.length) return;
      await flushQueue();
      if (SYNC.waiting) toast(navigator.onLine ? "Some changes couldn't be sent — tap the sync status to see why" : "Still offline — will send when connected");
    } });
  document.querySelectorAll("[data-qdrop]").forEach(b => b.onclick = async () => {
    if (!confirm("Discard this change? It hasn't reached SharePoint and will be lost.")) return;
    const op = ops.find(o => String(o.qid) === b.dataset.qdrop); await qDel(op.qid);
    D[op.key] = (D[op.key] || []).filter(x => x.ClientRef !== op.fields.ClientRef); await qCount(); $("#dlg").close(); render(); openSyncPanel(); });
}

const SNAP_KEY = () => mjeStoreKey("mjeSvcSnap:" + myUser());

  try {
    const mine = myJobNos(), jobs = D.jobs.filter(j => mine.has(j.Title)), sites = new Set(jobs.map(j => j.SiteCode)), custs = new Set(jobs.map(j => j.CustomerCode)), me = techName();

        chk: D.chk, sites: D.sites.filter(x => sites.has(x.SiteCode)), customers: D.customers.filter(c => custs.has(c.CustomerCode)).map(({ Title, CustomerCode, Phone }) => ({ Title, CustomerCode, Phone })),

let OFFLINE_AT = "";
function loadSnapshot(full){

    if (full){ siteId = snap.siteId; S.have = new Set(snap.have); S.staff = snap.staff || []; }

// Put changes still in the queue back on screen (after the app was closed, or opened offline)
async function replayQueue(){
  for (const op of await qMine()){
    const list = (D[op.key] ||= []);
    if (!list.some(x => x.ClientRef === op.fields.ClientRef)) list.push({ ...op.fields, id:"local-" + op.fields.ClientRef, _pending:true, _thumb: op.file?.blob ? URL.createObjectURL(op.file.blob) : undefined });
  }
}

/* ---------- timer + GPS ---------- */
const TIMER_KEY = () => mjeStoreKey("mjeTimer:" + myUser());
const getTimer = () => { try { return JSON.parse(localStorage.getItem(TIMER_KEY()) || "null"); } catch { return null; } };
const setTimer = t => { try { t ? localStorage.setItem(TIMER_KEY(), JSON.stringify(t)) : localStorage.removeItem(TIMER_KEY()); } catch {} };
const elapsed = t => { const m = Math.max(0, Math.round((Date.now() - t.ts) / 60000)); return `${Math.floor(m / 60)}:${pad(m % 60)}`; };
function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat: Math.round(p.coords.latitude * 1e6) / 1e6, lng: Math.round(p.coords.longitude * 1e6) / 1e6, acc: Math.round(p.coords.accuracy) }),
      () => res(null), { enableHighAccuracy:true, timeout:12000, maximumAge:60000 });
  });
}
function safetyWarnings(j){

  return { tags, gaps, any: tags.length || gaps.length };
}

      ${w.gaps.length ? `<div class="banner"><b>Training needed for ${esc(j.JobType)}</b><ul>${w.gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul>Tell the office if this is wrong.</div>` : ""}

/* ---------- checklists ----------
   MJE_Checklists.Questions holds either a list of questions (all Yes / No / N/A) or
   {"sections":[{"title":"…","questions":[{"q":"…","type":"yn|ynna|text|reading","req":true}]}]}.
   Until templates are set up in Settings, built-in Pre-start and JSA lists are used.          */
const BUILTIN_CHECKLISTS = {
  "pre-start": { type:"Pre-start", sections:[{ title:"Before work starts", questions:[
    "Signed in on site / permit to work obtained", "Work area inspected and safe to work in", "Tools and leads have in-date test & tag", "PPE available and in good condition",
    "Isolation points identified; test before touch planned", "Site contact told what work is happening"].map(q => ({ q, type:"ynna", req:true })) }] },
  "jsa": { type:"JSA", sections:[{ title:"The job", questions:[{ q:"Main steps of the job", type:"text", req:true }, { q:"Hazards for each step and how they're controlled", type:"text", req:true }] },
    { title:"Checks", questions:["Steps and hazards discussed with everyone on the job", "Isolation and lock-out in place where needed", "PPE checked and worn", "Emergency exit and first aid kit location known"].map(q => ({ q, type:"ynna", req:true })) }] },
};
function checklistTemplate(name){
  const t = (D.chk || []).filter(c => c.Title === name && c.TemplateStatus !== "Retired").sort((a, b) => num(b.TemplateVersion) - num(a.TemplateVersion))[0];
  if (t){ try { const q = JSON.parse(t.Questions || "[]");
    const sections = Array.isArray(q) ? [{ title:"", questions: q.map(x => typeof x === "string" ? { q:x, type:"ynna", req:true } : x) }] : (q.sections || []);
    return { name, version: num(t.TemplateVersion) || 1, sections }; } catch { /* fall through to built-in */ } }
  const key = /jsa|job safety/i.test(name) ? "jsa" : /pre.?start/i.test(name) ? "pre-start" : "";
  if (key) return { name, version:0, sections: BUILTIN_CHECKLISTS[key].sections };
  return { name, version:0, sections:[{ title:"", questions:[{ q:`${name} carried out`, type:"yn", req:true }, { q:"Notes", type:"text", req:false }] }] };
}
function openChecklist(j, name){
  const t = checklistTemplate(name); let n = 0;
  const qHtml = q => { const id = n++, nm = `q${id}`;
    const opts = q.type === "yn" ? ["Yes","No"] : ["Yes","No","N/A"];
    const input = (q.type === "text" || q.type === "reading")
      ? (q.type === "text" ? `<textarea name="${nm}" rows="2"></textarea>` : `<input name="${nm}" inputmode="decimal" placeholder="reading">`)
      : `<span class="yn">${opts.map(o => `<label><input type="radio" name="${nm}" value="${o}"><span>${o}</span></label>`).join("")}</span><input name="${nm}_note" class="ynnote" placeholder="What's the problem / action taken?" hidden>`;
    return `<div class="cq" data-q="${id}"><div class="cqt">${esc(q.q)}${q.req ? ` <span class="req"></span>` : ""}</div>${input}</div>`; };
  const flat = t.sections.flatMap(s => s.questions.map(q => typeof q === "string" ? { q, type:"ynna", req:true } : q));
  openDialog({ cls:"f-chk", kind:`My Jobs · ${t.version ? "Checklist v" + t.version : "Checklist"}`, title:`${name} — ${j.Title}`, save:"Save checklist",
    body: t.sections.map(s => `<fieldset>${s.title ? `<legend>${esc(s.title)}</legend>` : ""}${s.questions.map(q => qHtml(typeof q === "string" ? { q, type:"ynna", req:true } : q)).join("")}</fieldset>`).join(""),
    onSubmit: async () => {
      const answers = flat.map((q, i) => { const box = $(`#dlgBody [data-q="${i}"]`), r = box.querySelector("input[type=radio]:checked"), tx = box.querySelector(`[name=q${i}]:not([type=radio])`);
        return { q:q.q, a: r ? r.value : (tx ? tx.value.trim() : ""), note: box.querySelector(".ynnote")?.value.trim() || undefined, req: !!q.req }; });
      const gap = answers.findIndex(a => a.req && !a.a);
      if (gap >= 0){ $(`#dlgBody [data-q="${gap}"]`).scrollIntoView({ block:"center" }); return toast(`Answer every question marked * (question ${gap + 1})`); }
      const noAns = answers.filter(a => a.a === "No");
      if (noAns.some(a => !a.note)) return toast("Say what the problem is for each No answer");
      const now = new Date();
      await queueSave("resp", { Title:j.Title, ChecklistName:name, TemplateVersion:t.version || "", Technician: techName(), ResponseDate: ymd(now),
        Answers: JSON.stringify(answers.map(({ req, ...a }) => a)), Outcome: noAns.length ? "Actions required" : "Pass", IsComplete:"Yes" }, { label:`${name} on ${j.Title}` });
      $("#dlg").close(); toast(`${name} saved${noAns.length ? " — actions required" : ""}`); render();
    } });
  $("#dlgBody").onchange = e => { if (e.target.type === "radio"){ const note = e.target.closest(".cq").querySelector(".ynnote"); if (note) note.hidden = e.target.value !== "No"; } };
}

/* ---------- sign-off with signature ---------- */
function openMySignoff(j){
  const missing = requiredLists(j).filter(n => !checklistDone(j, n));
  if (missing.length) return toast(`Complete these checklists first: ${missing.join(", ")}`);
  const site = (D.sites || []).find(x => x.SiteCode === j.SiteCode);
  openDialog({ cls:"f-comp", kind:"My Jobs · Sign-off", title:`Complete ${j.Title}`, save:"Submit sign-off",
    body: formBody([["Work done", [["WorkSummary","What was done","textarea",{req:1,w:3}], ["FollowUpRequired","Follow-up needed?","select",{opts:["No","Yes"]}], ["FollowUpNotes","Follow-up notes","text",{w:2}] ]]], { FollowUpRequired:"No" })
      + micButton("WorkSummary")
      + `<fieldset><legend>Customer</legend><div class="fg"><label class="fld w3"><span>Customer's name</span><input name="SignedByName" value="${esc(site?.ContactName || j.ContactName || "")}" autocomplete="off"></label></div>
        <div class="sigwrap" id="sigWrap"><canvas id="sig" aria-label="Customer signature"></canvas><span class="sighint">Customer signs here</span></div>
        <div class="bar" style="margin:6px 0 0"><button type="button" class="btn sm" id="sigClear">Clear signature</button><span class="grow"></span>
        <label class="chk"><span><input type="checkbox" id="notPresent"> Customer not present</span></label></div>
        <label class="fld w3" id="npWrap" hidden><span class="req">Why the customer couldn't sign</span><input name="NotPresentReason"></label></fieldset>`,
    onSubmit: async () => {
      const f = readForm(), np = $("#notPresent").checked, signed = SIG.drawn;
      if (np ? !f.NotPresentReason : !(signed && f.SignedByName)) return toast(np ? "Give the reason the customer couldn't sign" : "Get the customer's signature and name, or tick Customer not present");
      const now = new Date(), blob = !np && signed ? await new Promise(r => $("#sig").toBlob(r, "image/png")) : null, name = `${j.Title}_signature_${Date.now()}.png`;
      await queueSave("comp", { Title:j.Title, Technician: techName(), CompletedDate: ymd(now), CompletedTime: hhmm(now), WorkSummary:f.WorkSummary, FollowUpRequired:f.FollowUpRequired, FollowUpNotes:f.FollowUpNotes,
        SignedByName: np ? "" : f.SignedByName, CustomerNotPresent: np ? "Yes" : "No", NotPresentReason: np ? f.NotPresentReason : "", ReviewStatus:"Submitted" },
        { label:`Sign-off for ${j.Title}`, file: blob ? { blob, name, folder:j.Title, field:"SignatureFile", type:"image/png" } : null });
      if (getTimer()?.job === j.Title) toast("Remember to stop the timer");
      $("#dlg").close(); toast(`${j.Title} signed off — the office will review it`); render();
    } });
  bindMic(); bindSignature();
  $("#notPresent").onchange = e => { $("#npWrap").hidden = !e.target.checked; $("#sigWrap").classList.toggle("off", e.target.checked); };
}
const SIG = { drawn:false };
function bindSignature(){
  const c = $("#sig"), wrap = $("#sigWrap"); SIG.drawn = false;
  const size = () => { const r = wrap.getBoundingClientRect(), d = window.devicePixelRatio || 1; c.width = r.width * d; c.height = 170 * d; c.style.height = "170px";
    const x = c.getContext("2d"); x.scale(d, d); x.lineWidth = 2.2; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#111"; };
  requestAnimationFrame(size);
  let last = null;
  const pt = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.onpointerdown = e => { if (wrap.classList.contains("off")) return; c.setPointerCapture(e.pointerId); last = pt(e); wrap.classList.add("inked"); };
  c.onpointermove = e => { if (!last) return; const p = pt(e), x = c.getContext("2d"); x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last = p; SIG.drawn = true; };
  c.onpointerup = c.onpointercancel = () => { last = null; };
  $("#sigClear").onclick = () => { c.getContext("2d").clearRect(0, 0, c.width, c.height); SIG.drawn = false; wrap.classList.remove("inked"); };
}

    <div class="mc-site">${esc(j.CustomerName || "")}${j.SiteName ? " · " + esc(j.SiteName) : ""}${site?.Town ? `<span class="count"> — ${esc(site.Town)}</span>` : ""}</div>

function offlineBanner(){

    : `<div class="banner">Offline — showing your jobs as they were at ${esc(hhmm(d))} on ${esc(fmtDate(ymd(d)))}. Anything you add is kept on this phone and sent when there's signal.</div>`;
}

let rolesWarned = false;
function bindRoles(){
  const tbl = $("table.roles"); if (!tbl) return;
  if (S.param === "roles") $("#roles").scrollIntoView({ block:"start" });
  const changed = () => [...tbl.querySelectorAll("tr[data-sid]")].map(tr => {
    const s = S.staff.find(x => String(x.id) === tr.dataset.sid), f = {};
    tr.querySelectorAll("[data-k]").forEach(el => { const v = el.value.trim(); if (v !== (s[el.dataset.k] || "")) f[el.dataset.k] = v; });
    tr.classList.toggle("dirty", Object.keys(f).length > 0);
    return Object.keys(f).length ? { s, f } : null;
  }).filter(Boolean);
  tbl.oninput = tbl.onchange = () => { const n = changed().length; $("#saveRoles").disabled = !n; $("#rolesDirty").textContent = n ? `${n} unsaved change${n === 1 ? "" : "s"}` : ""; rolesWarned = false; };
  $("#saveRoles").onclick = async () => {
    const todo = changed(); if (!todo.length) return;
    const bad = todo.find(({ f }) => f.Email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.Email));
    if (bad) return toast(`"${bad.f.Email}" doesn't look like an email address (${bad.s.Title})`);
    const emails = new Map();
    for (const s of S.staff){ const t = todo.find(x => x.s === s), e = norm(t && "Email" in t.f ? t.f.Email : s.Email); if (!e) continue;
      if (emails.has(e)) return toast(`${emails.get(e)} and ${s.Title} have the same email — each person needs their own`); emails.set(e, s.Title); }
    const mine = todo.find(x => x.s === S.me && "HubRole" in x.f && !OFFICE.includes(x.f.HubRole));
    if (mine && !rolesWarned){ rolesWarned = true; return toast("You're removing your own office access — you'll lose these screens. Click Save changes again if you're sure."); }
    $("#saveRoles").disabled = true;
    let ok = 0, denied = false;
    for (const { s, f } of todo){
      const out = {}; Object.entries(f).forEach(([k, v]) => out[k] = v === "" ? null : v);
      try { if (!DEMO) await saveListItem(CONFIG.LISTS.staff, s.id, out); Object.assign(s, f); ok++; }
      catch(e){ console.warn("Couldn't save", s.Title, e.message); if (isForbidden(e)) { denied = true; break; } }
    }
    [S.role, S.roleSource] = resolveRole(); readHash(); render();
    toast(denied ? `Only ${BRAND.SHORT} site owners can change staff roles — ask an owner to add you to the site Owners group.` : `Saved ${ok} change${ok === 1 ? "" : "s"}${ok < todo.length ? ` — ${todo.length - ok} couldn't be saved` : ""}`);
  };
}

/* Number formats (Settings → Numbering).  {yyyy} = this year, {n} = running number, {n:3} = at least 3 digits.
   e.g. "MP{n}" -> MP5813 · "{n}" -> 22782 · "Q-{yyyy}-{n:3}" -> Q-2026-014.  The counter is the format without {n}. */
const NUMBERING = {
  quote: ["QuoteFormat", "Quote numbers", () => `${setting("QuotePrefix", "Q")}-{yyyy}-{n:3}`],
  job:   ["JobFormat",   "Job numbers",   () => `${setting("JobPrefix", "J")}-{yyyy}-{n:3}`],
  po:    ["POFormat",    "Purchase order numbers", () => "{n}"],
};
const numFormat = kind => setting(NUMBERING[kind][0], "") || NUMBERING[kind][2]();
const numCounter = (fmt, kind) => fmt.replace(/\{yyyy\}/g, YEAR).replace(/[-_/ .]?\{n(:\d+)?\}/g, "") || kind.toUpperCase();
const numMake = (fmt, n) => fmt.replace(/\{yyyy\}/g, YEAR).replace(/\{n(?::(\d+))?\}/g, (m, w) => String(n).padStart(+w || 0, "0"));
const numRegex = fmt => new RegExp("^" + fmt.split(/(\{yyyy\}|\{n(?::\d+)?\})/).map(p => p === "{yyyy}" ? YEAR : /^\{n/.test(p) ? "(\\d+)" : p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("") + "$");
async function nextNumber(kind, existing){ const fmt = numFormat(kind); return takeNumber(numCounter(fmt, kind), n => numMake(fmt, n), numRegex(fmt), existing); }
// Customer / supplier codes in the style TSM and MYOB use: first 5 letters of the name + 3 digits (ABLEC001)
function suggestCode(name, used){
  const stem = (String(name || "").toUpperCase().replace(/[^A-Z0-9]/g, "") + "-----").slice(0, 5), taken = new Set(used.map(x => String(x || "").toUpperCase()));
  for (let i = 1; i < 1000; i++){ const c = stem + String(i).padStart(3, "0"); if (!taken.has(c)) return c; }
  return stem + Date.now().toString().slice(-4);
}

// Next number from MJE_ServiceNumbers: read, add one, write back only if nobody else changed it (If-Match); retry on a clash.
async function takeNumber(counter, prefixOrMaker, widthOrRegex, existing){
  const fmt = typeof prefixOrMaker === "function" ? prefixOrMaker : n => prefixOrMaker + String(n).padStart(widthOrRegex, "0");
  const re = widthOrRegex instanceof RegExp ? widthOrRegex : new RegExp("^" + String(prefixOrMaker).replace(/[-]/g, "\\-") + "(\\d+)$");
  const maxExisting = existing.reduce((m, v) => { const r = re.exec(v || ""); return r ? Math.max(m, +r[1]) : m; }, 0);
  if (DEMO) return fmt(maxExisting + 1);
  const base = `/sites/${siteId}/lists/${CONFIG.LISTS.numbers}/items`;
  for (let i = 0; i < 6; i++){
    const j = await graph(`${base}?expand=fields&$filter=fields/Title eq '${counter}'`, { headers:{ Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly" } });
    const row = j.value[0];
    if (!row){ const n = maxExisting + 1; await graph(base, { method:"POST", body: JSON.stringify({ fields:{ Title:counter, LastNumber:n } }) }); return fmt(n); }
    const n = Math.max(num(row.fields.LastNumber), maxExisting) + 1;
    try { await graph(`${base}/${row.id}/fields`, { method:"PATCH", headers:{ "If-Match": row.eTag || row["@odata.etag"] }, body: JSON.stringify({ LastNumber:n }) }); return fmt(n); }
    catch(e){ if (e.status === 412 || e.status === 409){ await new Promise(r => setTimeout(r, 300 + Math.random() * 700)); continue; } throw e; }
  }
  throw new Error("couldn't get the next number because others were saving at the same time — please try again");
}
async function setCounter(counter, last){
  if (DEMO) return;
  const base = `/sites/${siteId}/lists/${CONFIG.LISTS.numbers}/items`;
  const j = await graph(`${base}?expand=fields&$filter=fields/Title eq '${counter}'`, { headers:{ Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly" } });
  if (j.value[0]) await graph(`${base}/${j.value[0].id}/fields`, { method:"PATCH", body: JSON.stringify({ LastNumber:last }) });
  else await graph(base, { method:"POST", body: JSON.stringify({ fields:{ Title:counter, LastNumber:last } }) });
}
async function readCounter(counter){

const norm = v => String(v || "").trim().toLowerCase().replace(/\s+/g, " ");

  }

  // copies kept beside the codes so SharePoint views and exports read well

    else if (!item && !F.manualCode) out[F.code] = await takeNumber(F.counter, F.prefix, F.width, list.map(r => r[F.code]));

    const saved = DEMO ? { ...(item || { id:"demo" + Date.now() }), ...out } : { ...(item || {}), ...(await saveListItem(CONFIG.LISTS[F.list], item?.id, out)) };
    const before = item ? { ...item } : null;

// After a rename, update the name copies on linked records still in use (issued invoices keep the name they were issued with)
async function updateCopies(kind, before, after){
  const live = j => !["Invoiced","Cancelled"].includes(j.JobStatus), liveQ = q => ["Draft",PENDING].includes(qStatus(q)), todo = [];
  if (kind === "cust" && before.Title !== after.Title){
    const c = after.CustomerCode, n = { CustomerName: after.Title };
    D.sites.filter(x => x.CustomerCode === c).forEach(r => todo.push(["sites", r, n]));
    D.jobs.filter(j => j.CustomerCode === c && live(j)).forEach(r => todo.push(["jobs", r, n]));
    D.quotes.filter(q => q.CustomerCode === c && liveQ(q)).forEach(r => todo.push(["quotes", r, n]));
  }
  if (kind === "site"){
    const c = after.SiteCode;
    if (before.Title !== after.Title){ const n = { SiteName: after.Title };
      D.jobs.filter(j => j.SiteCode === c && live(j)).forEach(r => todo.push(["jobs", r, n]));
      D.quotes.filter(q => q.SiteCode === c && liveQ(q)).forEach(r => todo.push(["quotes", r, n])); }
    if (before.CustomerCode !== after.CustomerCode) D.assets.filter(a => a.SiteCode === c).forEach(r => todo.push(["assets", r, { CustomerCode: after.CustomerCode }]));
  }
  if (!todo.length) return;
  let ok = 0;
  for (const [key, r, f] of todo){ try { if (!DEMO) await saveListItem(CONFIG.LISTS[key], r.id, f); Object.assign(r, f); ok++; } catch(e){ console.warn("Couldn't update", key, r.Title, e.message); } }
  toast(`Updated the name on ${ok} linked record${ok === 1 ? "" : "s"}${ok < todo.length ? ` (${todo.length - ok} couldn't be changed)` : ""}`);
  render();
}

function myobState(c){
  if (c.MyobCardUID) return { cls:"p-ok", label:"Linked", note:`MYOB card ${c.MyobDisplayID || c.MyobCardUID}` };
  const q = (D.sync || []).filter(x => x.EntityType === "Customer" && x.EntityRef === c.CustomerCode).sort((a, b) => String(b.id).localeCompare(String(a.id), undefined, { numeric:true }))[0];
  if (q && q.SyncStatus === "Failed") return { cls:"p-crit", label:"MYOB error", note: q.ErrorMessage || "The last attempt failed", q };
  if (q && q.SyncStatus !== "Done") return { cls:"p-warn", label:"Awaiting MYOB", note:`${q.SyncAction} requested${q.RequestedBy ? " by " + q.RequestedBy : ""}`, q };
  return { cls:"p-grey", label:"Not linked", note:"" };
}

function totalsOf(ls){

      ${q.DeclineReason ? `<dt>${qStatus(q) === "Cancelled" ? "Cancelled" : "Not approved"} because</dt><dd>${lines(q.DeclineReason)}</dd>` : ""}</dl></div>

      : `<span class="count">Lines are locked once the quote is sent${["Approved","Not approved","Cancelled"].includes(st) ? " or decided" : " — use Back to draft to change them"}.</span>`}</div>
  ${draft ? `<div class="tablewrap"><table class="qlines" id="qlines"><thead><tr><th>Type</th><th>Description</th><th>Qty</th><th>Unit</th><th title="Never printed">Cost (internal)</th><th>Unit price ex GST</th><th>Tax</th><th>Amount</th><th></th></tr></thead>
      <tbody>${linesBody(ls)}</tbody></table></div>
      <div id="qtot">${totalsHtml(ls, true)}</div>
      <div class="bar" style="justify-content:flex-end;margin-top:12px"><span class="count" id="qDirty">${QE.dirty ? "Unsaved changes" : ""}</span><button class="btn" id="qDiscard" ${QE.dirty ? "" : "disabled"}>Discard changes</button><button class="btn primary" id="qSave" ${QE.dirty ? "" : "disabled"}>Save lines</button></div>`
    : `<div class="tablewrap"><table><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Unit price ex GST</th><th>Tax</th><th>Amount</th></tr></thead><tbody>
      ${ls.map(l => l.LineKind === "Text" ? `<tr class="txt"><td colspan="6"><b>${esc(l.Description)}</b></td></tr>`
        : `<tr><td>${esc(l.Description)}${l.LineKind === "Labour" && l.LabourRateCode ? ` <span class="count">${esc(l.LabourRateCode)}</span>` : ""}</td><td class="mono">${esc(l.Qty)}</td><td>${esc(l.Unit || "")}</td><td class="mono">${k2(l.UnitPriceEx)}</td><td>${esc(l.TaxCode || "GST")}</td><td class="mono">${k2(lineAmount(l))}</td></tr>`).join("")}
      </tbody></table>${ls.length ? "" : `<div class="empty">No lines</div>`}</div>${totalsHtml(ls, true)}`}`;
}

function newLine(kind){
  const base = { LineKind:kind, TaxCode:"GST", _new:true };
  if (kind === "Text") return base;
  return { ...base, Qty:1, Unit: kind === "Labour" ? "hr" : "each" };
}
function refreshLines(no){
  const QE = S.qe[no], tb = $("#qlines tbody"); if (!tb) return render();
  tb.innerHTML = linesBody(QE.lines); $("#qtot").innerHTML = totalsHtml(QE.lines, true); markDirty(no);
}
function markDirty(no){
  S.qe[no].dirty = true;
  if ($("#qDirty")) { $("#qDirty").textContent = "Unsaved changes"; $("#qSave").disabled = false; $("#qDiscard").disabled = false; }
}
function bindQuotes(){
  document.querySelectorAll("[data-newq]").forEach(b => b.onclick = () => { const [c, si] = b.dataset.newq.split("|"); openForm("quote", null, c ? { CustomerCode:c, SiteCode:si || "",
    ContactName: si ? (D.sites.find(x => x.SiteCode === si)?.ContactName || "") : (D.customers.find(x => x.CustomerCode === c)?.AccountsContact || ""),
    ContactEmail: si ? (D.sites.find(x => x.SiteCode === si)?.ContactEmail || D.customers.find(x => x.CustomerCode === c)?.Email || "") : (D.customers.find(x => x.CustomerCode === c)?.Email || "") } : {}); });
  if (S.route !== "quotes") return;
  document.querySelectorAll("[data-qf]").forEach(b => { const fn = () => { S.qf.status = b.dataset.qf; render(); }; b.onclick = fn; b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }; });
  const qq = $("#qq"); if (qq) qq.oninput = () => { S.qf.q = qq.value; const pos = qq.selectionStart; render(); const n = $("#qq"); n.focus(); n.setSelectionRange(pos, pos); };
  const q = D.quotes.find(x => x.Title === S.param); if (!q) return;
  const no = q.Title, QE = S.qe[no];
  document.querySelectorAll("[data-qact]").forEach(b => b.onclick = () => quoteAction(q, b.dataset.qact));
  document.querySelectorAll("[data-addl]").forEach(b => b.onclick = () => { QE.lines.push(newLine(b.dataset.addl)); refreshLines(no);
    const last = $("#qlines tbody tr:last-child"); (last?.querySelector('[data-f="LabourRateCode"]') || last?.querySelector('[data-f="Description"]'))?.focus(); });
  const tbl = $("#qlines"); if (!tbl) return;
  tbl.oninput = e => {
    const el = e.target, tr = el.closest("tr[data-i]"), k = el.dataset.f; if (!tr || !k) return;
    const l = QE.lines[+tr.dataset.i]; l[k] = el.value; markDirty(no);
    if (k === "LineKind"){ const n = { ...newLine(el.value), id:l.id, Description:l.Description }; QE.lines[+tr.dataset.i] = n; return refreshLines(no); }
    if (k === "LabourRateCode"){ const r = (D.rates || []).find(x => x.RateCode === el.value);
      if (r){ if (!l.Description || l.Description === l._rateTitle) l.Description = r.Title; l._rateTitle = r.Title; l.Unit = UNIT_OF[r.RateUnit] || "hr"; l.UnitPriceEx = num(r.RateEx);
        if (r.RateUnit === "Hour" && num(r.MinChargeHours) > num(l.Qty)) l.Qty = num(r.MinChargeHours); }
      return refreshLines(no); }
    if (k === "Description" && l.LineKind === "Parts"){ const p = findProduct(el.value); if (p){
      l.Description = p.Title; l.Unit = p.Unit || l.Unit || "each"; if (p.UnitCost !== "" && p.UnitCost != null) l.UnitCost = num(p.UnitCost);
      const sell = prodSell(p); if (sell !== "") { l.UnitPriceEx = sell; l._priceSet = true; } return refreshLines(no); } }
    if (k === "UnitPriceEx") l._priceSet = true;
    if (k === "UnitCost" && !l._priceSet && el.value !== ""){ l.UnitPriceEx = r2(num(el.value) * (1 + markupPct() / 100)); tr.querySelector('[data-f="UnitPriceEx"]').value = l.UnitPriceEx; }
    const lt = tr.querySelector(".lt"); if (lt) lt.textContent = k2(lineAmount(l));
    $("#qtot").innerHTML = totalsHtml(QE.lines, true);
  };
  tbl.onclick = e => {
    const rm = e.target.closest("[data-rm]"), mv = e.target.closest("[data-mv]");
    if (rm){ const [l] = QE.lines.splice(+rm.dataset.rm, 1); if (l.id) QE.removed.push(l.id); refreshLines(no); }
    if (mv){ const [i, d] = mv.dataset.mv.split("|").map(Number), j = i + d; if (j < 0 || j >= QE.lines.length) return; [QE.lines[i], QE.lines[j]] = [QE.lines[j], QE.lines[i]]; refreshLines(no); }
  };
  $("#qDiscard").onclick = () => { delete S.qe[no]; render(); toast("Changes discarded"); };
  $("#qSave").onclick = () => saveQuoteLines(q);
}
// Save the line editor: update changed lines, add new ones, delete removed ones, then store the totals on the quote.
// Progress is kept line by line, so if the connection drops, Save again carries on where it stopped.
async function saveQuoteLines(q){
  const QE = S.qe[q.Title];
  const bad = QE.lines.findIndex(l => l.LineKind !== "Text" && (!String(l.Description || "").trim() || l.Qty === "" || l.Qty == null || l.UnitPriceEx === "" || l.UnitPriceEx == null));
  if (bad >= 0) return toast(`Line ${bad + 1} needs a description, quantity and unit price`);
  const LIST = CONFIG.LISTS.qlines, txt = l => l.LineKind === "Text";
  const fieldsOf = (l, i) => ({ Title:q.Title, LineNo:i + 1, LineKind:l.LineKind, LabourRateCode: l.LineKind === "Labour" ? (l.LabourRateCode || null) : null,
    Description: String(l.Description || "").trim(), Qty: txt(l) ? null : num(l.Qty), Unit: txt(l) ? null : (l.Unit || null),
    UnitCost: l.LineKind === "Parts" && l.UnitCost !== "" && l.UnitCost != null ? num(l.UnitCost) : null, UnitPriceEx: txt(l) ? null : r2(l.UnitPriceEx),
    TaxCode: txt(l) ? null : (l.TaxCode || "GST"), LineTotalEx: txt(l) ? null : lineAmount(l) });
  const same = (a, b) => (a ?? "") === (b ?? "") || (typeof b === "number" && num(a) === b && a !== "" && a != null);
  $("#qSave").disabled = true;
  try {
    while (QE.removed.length){ const id = QE.removed[0]; if (!DEMO) await graph(`/sites/${siteId}/lists/${LIST}/items/${id}`, { method:"DELETE" }); QE.removed.shift(); D.qlines = D.qlines.filter(x => x.id !== id); }
    for (const [i, l] of QE.lines.entries()){
      const f = fieldsOf(l, i), orig = l.id ? D.qlines.find(x => x.id === l.id) : null;
      if (orig && Object.keys(f).every(k => same(orig[k], f[k]))) continue;
      const saved = DEMO ? { id: l.id || "demo" + Date.now() + i, ...f } : await saveListItem(LIST, l.id || null, f);
      const row = { ...(orig || {}), ...f, id: l.id || saved.id };
      l.id = row.id; delete l._new;
      D.qlines = D.qlines.filter(x => x.id !== row.id); D.qlines.push(row);
    }
    const t = totalsOf(QE.lines), tf = { SubtotalEx:t.sub, GST:t.gst, TotalInc:t.inc };
    if (!DEMO) await saveListItem(CONFIG.LISTS.quotes, q.id, tf);
    Object.assign(q, tf); delete S.qe[q.Title]; render(); toast(`Saved ${q.Title} — ${k2(t.inc)} inc GST`);
  } catch(e){ console.error(e); toast((isForbidden(e) ? NO_PERMISSION : "Save stopped: " + e.message) + " — click Save lines again to finish."); $("#qSave").disabled = false; }
}
async function setQuote(q, f, msg){
  try { if (!DEMO) await saveListItem(CONFIG.LISTS.quotes, q.id, f); Object.assign(q, f); render(); toast(msg); return true; }
  catch(e){ toast(isForbidden(e) ? `You don't have permission to change quotes — they're for the ${BRAND.SHORT} office.` : "Couldn't save: " + e.message); return false; }
}
function quoteReady(q){
  if (S.qe[q.Title]?.dirty){ toast("Save the lines first"); return false; }
  if (!quoteLines(q.Title).some(l => l.LineKind !== "Text")){ toast("Add at least one priced line first"); return false; }
  return true;
}
function quoteAction(q, act){
  if (act === "edit") return openForm("quote", q);
  if (act === "print"){ if (S.qe[q.Title]?.dirty) return toast("Save the lines first"); return openPrintMenu("quote", q); }
  if (act === "email"){ if (quoteReady(q)) openEmail(q); return; }
  if (act === "sent"){ if (quoteReady(q)) setQuote(q, sentFields(), `${q.Title} marked as sent — follow up on ${fmtDate(addDays(TODAY, followDays()))}`); return; }
  if (act === "accepted") return openApproval(q);
  if (act === "variant") return openVariant(q);
  if (act === "cancel") return openDialog({ cls:"f-quo", kind:"Quotes · Cancel", title:`Cancel ${q.Title}`, save:"Cancel the quote",
    body:`<fieldset><legend>Why is it cancelled?</legend><div class="fg"><label class="fld w3"><span>Reason</span><textarea name="reason" placeholder="e.g. replaced by option B, raised in error, client withdrew the enquiry"></textarea></label></div></fieldset>`,
    onSubmit: async () => { $("#dlg").close(); await setQuote(q, { QuoteStatus:"Cancelled", DeclineReason: val("reason") || null }, `${q.Title} cancelled`); } });
  if (act === "redraft") return setQuote(q, { QuoteStatus:"Draft", ...(quoteState(q) === "Expired" ? { ValidUntil: addDays(TODAY, num(setting("QuoteValidityDays", 30))) } : {}) }, `${q.Title} is back in draft`);
  if (act === "declined") return openDialog({ cls:"f-quo", kind:"Quotes · Not approved", title:`${q.Title} not approved`, save:"Mark as not approved",
    body:`<fieldset><legend>Why wasn't it approved?</legend><div class="fg"><label class="fld w3"><span>Reason (helps with future quotes)</span><textarea name="reason" placeholder="e.g. went with another contractor, price, timing, project cancelled"></textarea></label></div></fieldset>`,
    onSubmit: async () => { $("#dlg").close(); await setQuote(q, { QuoteStatus:"Not approved", DeclineReason: val("reason") || null }, `${q.Title} marked as not approved`); } });
  if (act === "follow") return openDialog({ cls:"f-quo", kind:"Quotes · Follow-up", title:`Followed up ${q.Title}`, save:"Save",
    body:`<fieldset><legend>Follow-up</legend><div class="fg"><label class="fld w2"><span>What did they say?</span><input name="note" placeholder="e.g. Still deciding, call back next week"></label>
      <label class="fld"><span class="req">Next follow-up</span><input type="date" name="next" required value="${addDays(TODAY, followDays())}"></label></div></fieldset>`,
    onSubmit: async () => { const who = S.me?.Title || account?.name || "", note = `${fmtDate(TODAY)} — followed up by ${who}${val("note") ? ": " + val("note") : ""}`;
      $("#dlg").close(); await setQuote(q, { FollowUpDate: val("next"), Notes: q.Notes ? q.Notes + "\n" + note : note }, `Next follow-up ${fmtDate(val("next"))}`); } });
  if (act === "convert") return openConvert(q);
}

function openApproval(q){

      await setQuote(q, { QuoteStatus:"Approved", ApprovalDate: val("adate"), ApprovalRef: val("aref") || null, ApprovedAmountEx: val("amt") === "" ? null : r2(val("amt")) }, `${q.Title} approved`); } });

// ---- another option of the same quote: MP5813 -> MP5813A -> MP5813B. Lines are copied into the editor; click Save lines.
async function openVariant(q){
  if (S.qe[q.Title]?.dirty) return toast("Save the lines first");
  const base = quoteBase(q.Title), used = new Set(D.quotes.map(x => x.Title));
  let letter = "A"; while (used.has(base + letter) && letter < "Z") letter = String.fromCharCode(letter.charCodeAt(0) + 1);
  if (used.has(base + letter)) return toast("No more option letters left for " + base);
  const no = base + letter, keep = ["Branch","CustomerCode","CustomerName","SiteCode","SiteName","JobType","Division","QuoteType","ContactName","ContactEmail","Scope","Terms","ClosingDate"];
  const nq = { Title:no, QuoteStatus:"Draft", QuoteDate:TODAY, ValidUntil: addDays(TODAY, num(setting("QuoteValidityDays", 30))), PreparedBy: S.me?.Title || account?.name || "", ActionedBy: q.ActionedBy || S.me?.Title || "",
    Notes:`Option ${letter} of ${q.Title}` };
  keep.forEach(k => { if (q[k] != null && q[k] !== "") nq[k] = q[k]; });
  try {
    const saved = DEMO ? { id:"demo" + Date.now(), ...nq } : await saveListItem(CONFIG.LISTS.quotes, null, nq);
    D.quotes.push({ ...nq, ...saved });
    S.qe[no] = { lines: quoteLines(q.Title).map(({ id, Title, ...l }) => ({ ...l })), removed: [], dirty: true };
    toast(`Created ${no} — the lines are copied: change them and click Save lines`); go("quotes", no);
  } catch(e){ toast(isForbidden(e) ? `You don't have permission to change quotes — they're for the ${BRAND.SHORT} office.` : "Couldn't create the option: " + e.message); }
}
// ---- convert an approved quote into a job

        Division: q.Division, InstructionMethod: "Quote approved", Branch: q.Branch || brDefault(), Team: S.me?.Team,

      D.jobs.push({ ...job, ...saved }); $("#dlg").close();
      if (await setQuote(q, { ...approvalFields(q, t), JobNo:no }, `Created job ${no} from ${q.Title}`)){ S.offer = { kind:"job", no }; go("jobs", no); }
    } });
}

let H2P;
const loadPdfMaker = () => H2P ||= new Promise((res, rej) => { const sc = document.createElement("script");
  sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"; sc.onload = res; sc.onerror = () => { H2P = null; rej(new Error("couldn't load the PDF maker — check the connection")); }; document.head.appendChild(sc); });
async function pdfBase64(html, name){
  await loadPdfMaker();
  const host = document.createElement("div"); host.style.cssText = "position:fixed;left:-10000px;top:0;width:760px;background:#fff"; host.innerHTML = html; document.body.appendChild(host);
  try {

// ---- email (from the shared accounts mailbox when it's set in Settings)
async function sendMail(message, from){
  const box = (from === undefined ? setting("AccountsMailbox", "") : from).trim(), scope = box ? "Mail.Send.Shared" : "Mail.Send";
  let tk; try { tk = (await msalApp.acquireTokenSilent({ scopes:[scope], account })).accessToken; } catch(e){ tk = (await msalApp.acquireTokenPopup({ scopes:[scope], account })).accessToken; }
  const r = await fetch(`https://graph.microsoft.com/v1.0/${box ? "users/" + encodeURIComponent(box) : "me"}/sendMail`,
    { method:"POST", headers:{ Authorization:"Bearer " + tk, "Content-Type":"application/json" }, body: JSON.stringify({ message, saveToSentItems:true }) });
  if (!r.ok){ let m = String(r.status); try { m = (await r.json()).error.message; } catch {}
    throw new Error(r.status === 403 || /denied|not have permission/i.test(m) ? (box ? `Your account isn't allowed to send as ${box}. Ask for "Send As" on that mailbox (Exchange admin centre).` : "Your account isn't allowed to send mail from the Hub.") : "Email not sent: " + m); }
}

  if (!T.tech) return;

  $("#tsAdd").onclick = () => { T.rows.push(tsBlank(T.rows.at(-1))); render(); document.querySelector("#tsGrid tbody tr:last-child [data-f=StartTime]")?.focus(); };

  grid.oninput = grid.onchange = e => { const tr = e.target.closest("tr[data-i]"), k = e.target.dataset.f; if (!tr || !k) return;
    const r = T.rows[+tr.dataset.i]; r[k] = e.target.value;

    tr.querySelector(".lt").textContent = hoursBetween(r.StartTime, r.EndTime) || ""; sumUp(); };
  grid.onclick = e => { const b = e.target.closest("[data-tsrm]"); if (b){ T.rows.splice(+b.dataset.tsrm, 1); render(); } };

async function saveTimesheet(){
  const T = S.ts, rows = T.rows.filter(r => r.StartTime || r.EndTime || r.JobNo || r.Notes);
  if (!rows.length) return toast("Nothing to save — fill in a line first");
  for (const [i, r] of rows.entries()){
    const h = hoursBetween(r.StartTime, r.EndTime);
    if (!r.StartTime || !r.EndTime || !(h > 0)) return toast(`Line ${i + 1}: enter a start and a finish time (finish after start)`);
    if (r.Category === "Job" && !r.JobNo) return toast(`Line ${i + 1}: job time needs a job number — or choose Admin, Travel…`);
    if (r.JobNo && D.jobs && !jobByNo(r.JobNo.trim())) return toast(`Line ${i + 1}: there's no job ${r.JobNo}`);
  }
  const all = [...(D.time || []).filter(t => t.Technician === T.tech && t.EntryDate === T.date && t.StartTime && t.EndTime), ...rows];
  const clash = all.find((a, i) => all.some((b, k) => k > i && a.StartTime < b.EndTime && b.StartTime < a.EndTime));
  if (clash && S.ts.warned !== T.tech + T.date){ S.ts.warned = T.tech + T.date; return toast(`Two lines overlap (one starts ${clash.StartTime}) — check the times, or click Save again to keep them`); }
  const rate0 = activeRates()[0]?.RateCode || "", btn = $("#tsSave"); btn.disabled = true;
  let n = 0;
  try {
    for (const r of rows){
      const h = hoursBetween(r.StartTime, r.EndTime), job = r.Category === "Job" || r.Category === "Travel" ? r.JobNo.trim() : "", bill = r.Category === "Job" && r.Billable !== "No";
      await saveRow("time", null, { Title:`${T.tech} — ${T.date}`, Technician:T.tech, EntryDate:T.date, StartTime:r.StartTime, EndTime:r.EndTime, Category:r.Category, JobNo: job || null,
        ActualHours:h, BillableHours: bill ? roundBillable(h) : 0, Billable: bill ? "Yes" : "No", LabourRateCode: r.Category === "Job" ? (r.LabourRateCode || rate0 || null) : null,
        Source:"Office", Notes: r.Notes || null, ClientRef: newRef() });
      T.rows.splice(T.rows.indexOf(r), 1); n++;
    }
    T.rows = []; render(); toast(`Saved ${n} line${n === 1 ? "" : "s"} for ${T.tech}`);
  } catch(e){ toast((isForbidden(e) ? NO_PERMISSION : "Save stopped: " + e.message) + (n ? ` — ${n} line(s) saved; the rest are still here` : "")); render(); }
}

/* =====================================================================
   PURCHASING — purchase orders to suppliers (MJE_PurchaseOrders + MJE_PurchaseOrderLines)
   Draft → Sent → Part received / Received → Closed (or Cancelled). Numbers carry on from TSM's (30773…).
   A PO can be for a job or for stock. Receiving goods can add the items to the job's materials
   at cost plus markup, so parts bought for a job are charged on its invoice.
   ===================================================================== */
const PO_OPEN = ["Draft","Sent","Part received"], PO_WAITING = ["Sent","Part received"];
const POPILL = { Draft:"p-grey", Sent:"p-info", "Part received":"p-warn", Received:"p-ok", Closed:"p-grey", Cancelled:"p-grey" };
const poStatus = p => p.POStatus || "Draft";
const poLate = p => PO_WAITING.includes(poStatus(p)) && p.ETA && p.ETA < TODAY;
const poPill = p => `<span class="pill ${POPILL[poStatus(p)] || "p-grey"}">${esc(poStatus(p))}</span>${poLate(p) ? ` <span class="pill p-crit">overdue</span>` : ""}`;
const poByNo = no => (D.po || []).find(p => p.Title === no);
const poLines = no => (D.poline || []).filter(l => l.Title === no).sort((a, b) => num(a.LineNo) - num(b.LineNo));
const poLineAmt = l => r2(num(l.Qty) * num(l.UnitCost));
function poTotals(ls){
  let sub = 0, gst = 0;
  ls.forEach(l => { const t = poLineAmt(l); sub += t; if ((l.TaxCode || "GST") === "GST") gst += t * gstPct() / 100; });
  sub = r2(sub); gst = r2(gst); return { sub, gst, inc: r2(sub + gst) };
}
const suppOpts = () => (D.supp || []).filter(x => x.SupplierStatus !== "Inactive").sort((a, b) => String(a.Title).localeCompare(String(b.Title))).map(x => [x.SupplierCode, `${x.Title} (${x.SupplierCode})`]);
const brKey = b => "PODeliverTo_" + String(b || "").replace(/[^A-Za-z0-9]/g, "");
const poDeliverTo = b => setting(brKey(b), "") || setting("PODeliverTo", "") || [setting("CompanyName", BRAND.COMPANY), setting("CompanyDetails", "").split(/\r?\n/)[0]].filter(Boolean).join("\n");
// PO lines are read per purchase order (there are tens of thousands); a PO's lines are read when it's opened
async function needPOLines(no){
  if (!D.poline) D.poline = [];
  if (DEMO || !no || S.poRead.has(no) || !S.have.has(CONFIG.LISTS.poline)) return;
  S.poRead.add(no);
  try { const rows = await listItems(CONFIG.LISTS.poline, `fields/Title eq '${String(no).replace(/'/g, "''")}'`);
    const mine = rows.filter(r => r.Title === no), have = new Set(D.poline.map(r => r.id)); mine.forEach(r => { if (!have.has(r.id)) D.poline.push(r); }); }
  catch(e){ S.poRead.delete(no); throw e; }
}
