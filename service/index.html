function poRefresh(no){
  const PE = S.pe[no], tb = $("#plines tbody"); if (!tb) return render();
  tb.innerHTML = poLinesBody(PE.lines); $("#ptot").innerHTML = poTotalsHtml(PE.lines); poDirty(no);
}
function poDirty(no){
  S.pe[no].dirty = true;
  if ($("#pDirty")) { $("#pDirty").textContent = "Unsaved changes"; $("#pSave").disabled = false; $("#pDiscard").disabled = false; }
}
function bindPurchases(){
  document.querySelectorAll("[data-newpo]").forEach(b => b.onclick = () => openForm("po", null, b.dataset.newpo ? poFromJob(b.dataset.newpo) : {}));
  if (S.route !== "purchases") return;
  document.querySelectorAll("[data-pof]").forEach(b => { const fn = () => { S.pof.status = b.dataset.pof; render(); }; b.onclick = fn; b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }; });
  const pq = $("#poq"); if (pq) pq.oninput = () => { S.pof.q = pq.value; const pos = pq.selectionStart; render(); const n = $("#poq"); n.focus(); n.setSelectionRange(pos, pos); };
  if ($("#posupp")) $("#posupp").onchange = e => { S.pof.supp = e.target.value; render(); };
  const p = poByNo(S.param); if (!p) return;
  const no = p.Title, PE = S.pe[no];
  document.querySelectorAll("[data-pact]").forEach(b => b.onclick = () => poAction(p, b.dataset.pact));
  const add = $("[data-addpl]"); if (add) add.onclick = () => { PE.lines.push({ Qty:1, Unit:"each", TaxCode:"GST", JobNo: p.JobNo || "", _new:true }); poRefresh(no); $("#plines tbody tr:last-child [data-f=Description]")?.focus(); };
  const tbl = $("#plines"); if (!tbl) return;
  tbl.oninput = e => {
    const el = e.target, tr = el.closest("tr[data-i]"), k = el.dataset.f; if (!tr || !k) return;
    const l = PE.lines[+tr.dataset.i]; l[k] = el.value; poDirty(no);
    if (k === "Description"){ const pr = findProduct(el.value); if (pr){ l.Description = pr.Title; l.ProductCode = pr.ProductCode || l.ProductCode; l.Unit = pr.Unit || l.Unit || "each";
      if (pr.UnitCost !== "" && pr.UnitCost != null) l.UnitCost = num(pr.UnitCost); return poRefresh(no); } }
    const lt = tr.querySelector(".lt"); if (lt) lt.textContent = k2(poLineAmt(l));
    $("#ptot").innerHTML = poTotalsHtml(PE.lines);
  };
  tbl.onclick = e => {
    const rm = e.target.closest("[data-rm]"), mv = e.target.closest("[data-mv]");
    if (rm){ const [l] = PE.lines.splice(+rm.dataset.rm, 1); if (l.id) PE.removed.push(l.id); poRefresh(no); }
    if (mv){ const [i, d] = mv.dataset.mv.split("|").map(Number), k = i + d; if (k < 0 || k >= PE.lines.length) return; [PE.lines[i], PE.lines[k]] = [PE.lines[k], PE.lines[i]]; poRefresh(no); }
  };
  $("#pDiscard").onclick = () => { delete S.pe[no]; render(); toast("Changes discarded"); };
  $("#pSave").onclick = () => savePOLines(p);
}
const poFromJob = no => { const j = jobByNo(no); return { JobNo:no, ...(j?.Branch ? { Branch:j.Branch, DeliverTo: poDeliverTo(j.Branch) } : {}) }; };
// Save the item editor (same way as quote lines): changed lines updated, new ones added, removed ones deleted, totals stored on the PO
async function savePOLines(p){
  const PE = S.pe[p.Title];
  const bad = PE.lines.findIndex(l => !String(l.Description || "").trim() || l.Qty === "" || l.Qty == null || l.UnitCost === "" || l.UnitCost == null);
  if (bad >= 0) return toast(`Item ${bad + 1} needs a description, quantity and unit cost`);
  const LIST = CONFIG.LISTS.poline;
  const fieldsOf = (l, i) => ({ Title:p.Title, LineNo:i + 1, ProductCode: String(l.ProductCode || "").trim() || null, Description: String(l.Description || "").trim(), Qty: num(l.Qty), Unit: l.Unit || null,
    UnitCost: num(l.UnitCost), TaxCode: l.TaxCode || "GST", LineTotalEx: poLineAmt(l), JobNo: l.JobNo || p.JobNo || null });
  const same = (a, b) => (a ?? "") === (b ?? "") || (typeof b === "number" && num(a) === b && a !== "" && a != null);
  $("#pSave").disabled = true;
  try {
    if (!D.poline) D.poline = [];
    while (PE.removed.length){ const id = PE.removed[0]; if (!DEMO) await graph(`/sites/${siteId}/lists/${LIST}/items/${id}`, { method:"DELETE" }); PE.removed.shift(); D.poline = D.poline.filter(x => x.id !== id); }
    for (const [i, l] of PE.lines.entries()){
      const f = fieldsOf(l, i), orig = l.id ? D.poline.find(x => x.id === l.id) : null;
      if (orig && Object.keys(f).every(k => same(orig[k], f[k]))) continue;
      const saved = DEMO ? { id: l.id || "demo" + Date.now() + i, ...f } : await saveListItem(LIST, l.id || null, f);
      const row = { ...(orig || {}), ...f, id: l.id || saved.id };
      l.id = row.id; delete l._new;
      D.poline = D.poline.filter(x => x.id !== row.id); D.poline.push(row);
    }
    const t = poTotals(PE.lines), tf = { SubtotalEx:t.sub, GST:t.gst, TotalInc:t.inc };
    if (!DEMO) await saveListItem(CONFIG.LISTS.po, p.id, tf);
    Object.assign(p, tf); delete S.pe[p.Title]; render(); toast(`Saved PO ${p.Title} — ${k2(t.inc)} inc GST`);
  } catch(e){ console.error(e); toast((isForbidden(e) ? PO_NO_PERMISSION : "Save stopped: " + e.message) + " — click Save lines again to finish."); $("#pSave").disabled = false; }
}
const PO_NO_PERMISSION = `You don't have permission to change purchase orders — they're for the ${BRAND.SHORT} office.`;
async function setPO(p, f, msg){
  try { if (!DEMO) await saveListItem(CONFIG.LISTS.po, p.id, f); Object.assign(p, f); render(); toast(msg); return true; }
  catch(e){ toast(isForbidden(e) ? PO_NO_PERMISSION : "Couldn't save: " + e.message); return false; }
}
function poReady(p){
  if (S.pe[p.Title]?.dirty){ toast("Save the items first"); return false; }
  if (!poLines(p.Title).length){ toast("Add at least one item first"); return false; }
  return true;
}
function poAction(p, act){
  const no = p.Title;
  if (act === "edit") return openForm("po", p);
  if (act === "print"){ if (S.pe[no]?.dirty) return toast("Save the items first"); return printDoc(poPrintHtml(p), "PO " + no); }
  if (act === "email"){ if (poReady(p)) openPOEmail(p); return; }
  if (act === "sent"){ if (poReady(p)) setPO(p, { POStatus:"Sent", SentDate:TODAY }, `PO ${no} marked as sent`); return; }
  if (act === "redraft") return setPO(p, { POStatus:"Draft" }, `PO ${no} is back in draft`);
  if (act === "receive") return openReceive(p);
  if (act === "reopen"){ const ls = poLines(no), all = ls.length && ls.every(l => num(l.ReceivedQty) >= num(l.Qty));
    return setPO(p, { POStatus: p.POStatus === "Cancelled" ? "Draft" : all ? "Received" : ls.some(l => num(l.ReceivedQty) > 0) ? "Part received" : "Sent" }, `PO ${no} reopened`); }
  if (act === "close") return openDialog({ cls:"f-po", kind:"Purchasing · Close", title:`Close PO ${no}`, save:"Close the PO",
    body:`<fieldset><legend>Close</legend><div class="fg"><label class="fld w3"><span>Note (optional)</span><input name="note" placeholder="${p.POStatus === "Received" ? "e.g. supplier invoice checked" : "e.g. balance not needed, supplier can't supply the rest"}"></label></div></fieldset>
      <p class="count">A closed PO no longer shows as awaiting delivery.${PO_WAITING.includes(poStatus(p)) ? " Anything not received yet won't be chased." : ""}</p>`,
    onSubmit: async () => { const note = val("note") ? `${fmtDate(TODAY)} — closed by ${me()}: ${val("note")}` : ""; $("#dlg").close();
      await setPO(p, { POStatus:"Closed", ...(note ? { InternalNotes: p.InternalNotes ? p.InternalNotes + "\n" + note : note } : {}) }, `PO ${no} closed`); } });
  if (act === "cancel") return openDialog({ cls:"f-po", kind:"Purchasing · Cancel", title:`Cancel PO ${no}`, save:"Cancel the PO",
    body:`<fieldset><legend>Why is it cancelled?</legend><div class="fg"><label class="fld w3"><span>Reason</span><input name="reason" placeholder="e.g. ordered elsewhere, raised in error"></label></div></fieldset>
      ${p.SentDate ? `<p class="count">This PO was sent on ${fmtDate(p.SentDate)} — let the supplier know it's cancelled.</p>` : ""}`,
    onSubmit: async () => { const note = `${fmtDate(TODAY)} — cancelled by ${me()}${val("reason") ? ": " + val("reason") : ""}`; $("#dlg").close();
      await setPO(p, { POStatus:"Cancelled", InternalNotes: p.InternalNotes ? p.InternalNotes + "\n" + note : note }, `PO ${no} cancelled`); } });
}

/* ---------------- receiving goods ----------------
   Enter what arrived. Lines for a job can go straight onto the job's materials (cost plus markup, charged on the invoice).
   A PO with everything received becomes Received; otherwise Part received.                                                */
async function addMaterialRow(f){
  if (D.mat) return saveRow("mat", null, f);
  if (!DEMO) await saveListItem(CONFIG.LISTS.mat, null, f);
}
// "Added to job" with nothing received yet = handled elsewhere (POs imported from TSM, whose materials came across with the jobs)
const poHandled = l => l.AddedToJob === "Yes" && !(num(l.ReceivedQty) > 0);
function openReceive(p){
  const ls = poLines(p.Title); if (!ls.length) return toast("This PO has no items");
  const left = l => Math.max(0, r2(num(l.Qty) - num(l.ReceivedQty)));
  openDialog({ cls:"f-po", kind:"Purchasing · Receive goods", title:`Receive goods on PO ${p.Title}`, save:"Save receipt",
    body:`<fieldset><legend>Delivery</legend><div class="fg">
      <label class="fld"><span class="req">Date received</span><input type="date" name="rdate" required value="${TODAY}"></label>
      <label class="fld"><span>Delivery docket / supplier invoice no.</span><input name="dref"></label>
      <label class="fld"><span>Markup % on items added to jobs</span><input type="number" step="any" min="0" name="mk" value="${esc(markupPct())}"></label></div></fieldset>
      <fieldset><legend>Items</legend><div class="tablewrap"><table class="rcv"><thead><tr><th>Item</th><th>Ordered</th><th>Received before</th><th>Received now</th><th>Add to job materials</th></tr></thead><tbody>
      ${ls.map((l, i) => `<tr><td>${esc(l.Description)}${l.ProductCode ? ` <span class="count">${esc(l.ProductCode)}</span>` : ""}</td><td class="mono">${esc(l.Qty)} ${esc(l.Unit || "")}</td><td class="mono">${num(l.ReceivedQty) || "—"}</td>
        <td><input type="number" step="any" min="0" class="num" name="rq_${i}" value="${left(l) || ""}" aria-label="Received now"></td>
        <td>${l.JobNo ? `<label><input type="checkbox" name="aj_${i}" ${poHandled(l) ? "" : "checked"}> job ${esc(l.JobNo)}</label>${poHandled(l) ? ` <span class="count">already on the job</span>` : ""}` : `<span class="count">stock</span>`}</td></tr>`).join("")}
      </tbody></table></div><p class="count">Ticked items are added to the job's materials at cost plus the markup, ready to charge on the invoice. Leave a quantity blank for items not delivered.</p></fieldset>`,
    onSubmit: async () => {
      const when = val("rdate"), mk = num(val("mk")), todo = ls.map((l, i) => ({ l, q: num(val("rq_" + i)), add: !!$(`#dlgBody [name="aj_${i}"]`)?.checked })).filter(x => x.q > 0);
      if (!todo.length) return toast("Enter the quantity received on at least one item");
      let added = 0;
      for (const { l, q, add } of todo){
        const f = { ReceivedQty: r2(num(l.ReceivedQty) + q) };
        if (add && l.JobNo){
          await addMaterialRow({ Title:l.JobNo, ItemCode: l.ProductCode || "", Description: l.Description, Qty:q, Unit: l.Unit || "each", UnitCost: num(l.UnitCost), MarkupPct: mk,
            UnitSell: r2(num(l.UnitCost) * (1 + mk / 100)), Billable:"Yes", MaterialSource:"Purchased", Supplier: p.SupplierName || "", AddedBy: me(), EntryDate: when,
            ClientRef: `PO${p.Title}-L${l.LineNo || 0}-${Date.now().toString(36)}` });
          f.AddedToJob = "Yes"; added++;
        }
        if (!DEMO) await saveListItem(CONFIG.LISTS.poline, l.id, f);
        Object.assign(l, f);
      }
      const all = ls.every(l => num(l.ReceivedQty) >= num(l.Qty)), ref = val("dref");
      const pf = { POStatus: all ? "Received" : "Part received", ...(all ? { ReceivedDate: when } : {}), ...(ref ? { DeliveryRef: p.DeliveryRef ? p.DeliveryRef + "; " + ref : ref } : {}) };
      $("#dlg").close();
      await setPO(p, pf, `PO ${p.Title}: ${todo.length} item${todo.length === 1 ? "" : "s"} received${added ? `, ${added} added to job materials` : ""}${all ? " — all received" : ""}`);
      const jobs = [...new Set(todo.filter(x => x.l.JobNo).map(x => x.l.JobNo))];
      for (const jn of jobs){ const j = jobByNo(jn); if (j && !CLOSED.includes(j.JobStatus)) await addUpdate(j, `Goods received on PO ${p.Title} from ${p.SupplierName || "the supplier"}${all ? "" : " (part delivery)"}`, true); }
    } });
}

function openPOEmail(p){
  const box = setting("POMailbox", "").trim(), co = setting("CompanyName", BRAND.COMPANY), first = String(p.SupplierContact || "").trim().split(/\s+/)[0];
  const msg = `Dear ${first || "Sir/Madam"},\n\nPlease find attached our purchase order ${p.Title}${p.RequiredDate ? `, required by ${fmtDate(p.RequiredDate)}` : ""}.\n\nPlease confirm the order and the expected delivery date, and quote PO ${p.Title} on your delivery docket and invoice.\n\nKind regards,\n${me()}\n${co}`;
  openDialog({ cls:"f-po", kind:"Purchasing · Email", title:`Email PO ${p.Title}`, save:"Send",
    body:`<fieldset><legend>Email</legend><div class="fg">
      <label class="fld w3"><span>From</span><input readonly tabindex=-1 value="${esc(box || `${account?.username || ""} — your own mailbox (a shared purchasing mailbox can be set in Settings)`)}"></label>
      <label class="fld w2"><span class="req">To (separate several with ;)</span><input name="to" required value="${esc(p.SupplierEmail || "")}"></label>
      <label class="fld"><span>Cc</span><input name="cc" value=""></label>
      <label class="fld w3"><span class="req">Subject</span><input name="subject" required value="${esc(`Purchase order ${p.Title} from ${co}`)}"></label>
      <label class="fld w3"><span>Message</span><textarea name="body" style="min-height:190px">${esc(msg)}</textarea></label>
      <label class="fld w3 chk"><span><input type="checkbox" id="attachPdf" checked> Attach the PO as a PDF (PO ${esc(p.Title)}.pdf)</span></label></div></fieldset>
      ${p.POStatus === "Draft" ? `<p class="count">Sending marks the PO as sent.</p>` : ""}`,
    onSubmit: async () => {
      const split = v => v.split(/[;,]/).map(x => x.trim()).filter(Boolean), to = split(val("to")), cc = split(val("cc"));
      const bad = [...to, ...cc].find(a => !EMAIL_RE.test(a)); if (bad) return toast(`"${bad}" doesn't look like an email address`);
      let pdf = null;
      if ($("#attachPdf").checked){ toast("Making the PDF…"); pdf = await pdfBase64(poPrintHtml(p), `PO ${p.Title}.pdf`); }
      const message = { subject: val("subject"), body:{ contentType:"HTML", content: esc($("#dlgBody [name=body]").value).replace(/\n/g, "<br>") },
        toRecipients: to.map(a => ({ emailAddress:{ address:a } })), ccRecipients: cc.map(a => ({ emailAddress:{ address:a } })),
        attachments: pdf ? [{ "@odata.type":"#microsoft.graph.fileAttachment", name:`PO ${p.Title}.pdf`, contentType:"application/pdf", contentBytes:pdf }] : [] };
      if (!DEMO) await sendMail(message, box);
      $("#dlg").close();
      if (p.POStatus === "Draft") await setPO(p, { POStatus:"Sent", SentDate:TODAY }, `Emailed PO ${p.Title} to ${to.join(", ")} and marked it as sent`); else toast(`Emailed PO ${p.Title} to ${to.join(", ")}`);
    } });
}

/* ---------------- on the job page ---------------- */
function jobPurchases(j){
  const rows = (D.po || []).filter(p => p.JobNo === j.Title).sort((a, b) => String(b.Title).localeCompare(String(a.Title), undefined, { numeric:true }));
  const live = rows.filter(p => p.POStatus !== "Cancelled"), total = live.reduce((t, p) => t + num(p.SubtotalEx), 0);
  return `<div class="bar"><span class="count">${live.length} purchase order${live.length === 1 ? "" : "s"} · ${k2(total)} ex GST</span><span class="grow"></span><button class="btn primary" data-newpo="${esc(j.Title)}">+ New purchase order</button></div>
  <div class="tablewrap"><table><thead><tr><th>PO</th><th>Date</th><th>Supplier</th><th>Reference</th><th>ETA</th><th>Total ex GST</th><th>Status</th></tr></thead><tbody>
  ${rows.map(p => `<tr data-go="purchases/${encodeURIComponent(p.Title)}" tabindex="0" class="${p.POStatus === "Cancelled" ? "muted" : ""}"><td class="mono"><b>${esc(p.Title)}</b></td><td class="mono">${fmtDate(p.OrderDate)}</td>
    <td>${esc(p.SupplierName || "")}</td><td>${esc(p.Reference || "")}</td><td class="mono">${PO_WAITING.includes(poStatus(p)) ? fmtDate(p.ETA) : ""}</td><td class="mono">${k2(p.SubtotalEx)}</td><td>${poPill(p)}</td></tr>`).join("")}
  </tbody></table>${rows.length ? "" : `<div class="empty">No purchase orders for this job — click <b>+ New purchase order</b> to order parts from a supplier</div>`}</div>

const jobOnOrder = no => (D.po || []).filter(p => p.JobNo === no && PO_WAITING.includes(poStatus(p)));

/* =====================================================================
   SCHEDULER — one row per technician; day view (time line) and week view
   Drag an unscheduled job onto a person, drag a booking to move it,
   drag its right edge to change the finish time (day view). Clashes are flagged.
   ===================================================================== */
const DAY_START = 6 * 60, DAY_END = 20 * 60, DAY_SPAN = DAY_END - DAY_START, SNAP = 15;
const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
S.sf = { view:"week", date:TODAY, q:"", all:false, team:"", branch:"" };
const toMin = t => { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const toHHMM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const dowOf = d => { const [y, m, dd] = d.split("-").map(Number); return (new Date(y, m - 1, dd).getDay() + 6) % 7; };   // Mon = 0
const weekStart = d => addDays(d, -dowOf(d));
const dayLabel = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd).toLocaleDateString("en-AU", { weekday:"short", day:"numeric", month:"short" }); };
const liveBookings = () => D.assign.filter(a => a.AssignStatus !== "Cancelled");
function schedRows(from, to){
  const keep = n => { const p = S.staff.find(s => s.Title === n); return (!S.sf.team || p?.Team === S.sf.team) && (!S.sf.branch || p?.Branch === S.sf.branch); };
  if (S.sf.team || S.sf.branch) return technicians().filter(keep);
  if (S.branch){
    const ours = new Set(D.jobs.filter(j => brOf(j) === S.branch).map(j => j.Title));
    const names = technicians().filter(n => brOf(S.staff.find(s => s.Title === n)) === S.branch);
    const booked = liveBookings().filter(a => a.AssignDate >= from && a.AssignDate <= to && ours.has(a.Title)).map(a => a.Technician).filter(Boolean);
    return [...names, ...[...new Set(booked)].filter(n => !names.includes(n)).sort((a, b) => a.localeCompare(b))];
  }
  const names = technicians(), inRange = liveBookings().filter(a => a.AssignDate >= from && a.AssignDate <= to).map(a => a.Technician).filter(Boolean);
  return [...names, ...[...new Set(inRange)].filter(n => !names.includes(n)).sort((a, b) => a.localeCompare(b))];
}
const blockLabel = (a, j) => `<b>${esc(a.Title)}</b> ${esc(j?.SiteName || j?.CustomerName || "")}`;
const blockTitle = (a, j, cl) => `${a.Title} — ${j?.CustomerName || ""}${j?.SiteName ? " · " + j.SiteName : ""}${a.LocationOnSite || j?.LocationOnSite ? " · " + (a.LocationOnSite || j.LocationOnSite) : ""}\n${a.Technician} ${fmtDate(a.AssignDate)} ${a.StartTime || ""}–${a.EndTime || ""}${a.CompetencyWarning ? "\n⚠ " + a.CompetencyWarning : ""}${cl ? "\n⛔ clashes with another booking" : ""}\nClick to edit · drag to move`;
const priClass = j => j ? ({ Urgent:"p-urgent", High:"p-high" }[j.Priority] || "") : "";

function viewSchedule(){
  const pv = { day:"day", week:"week", today:"day" }[S.param]; if (pv){ S.sf.view = pv; if (S.param !== "week") S.sf.date = TODAY; history.replaceState(null, "", "#/schedule"); S.param = ""; }
  const f = S.sf, day = f.view === "day", from = day ? f.date : weekStart(f.date), to = day ? f.date : addDays(from, 6);
  const rows = schedRows(from, to), jobs = new Map(D.jobs.map(j => [j.Title, j])), facts = jobFacts();
  const book = liveBookings().filter(a => a.AssignDate >= from && a.AssignDate <= to);
  const hrs = n => Math.round(book.filter(a => a.Technician === n).reduce((t, a) => t + hoursBetween(a.StartTime, a.EndTime), 0) * 10) / 10;
  const title = day ? dayLabel(f.date) + (f.date === TODAY ? " · today" : "") : `${dayLabel(from)} – ${dayLabel(to)}`;
  const grid = !rows.length ? `<div class="empty">No technicians yet — set people's Service Hub role to Technician in Settings → Staff &amp; roles</div>`
    : day ? dayGrid(rows, f.date, book, jobs, hrs) : weekGrid(rows, from, book, jobs, hrs);
  // jobs waiting to be booked
  const q = norm(f.q), cand = D.jobs.map(j => ({ ...j, _st: jobState(j, facts) }))
    .filter(j => (f.all ? !CLOSED.includes(j._st) && j._st !== "On Hold" : j._st === "New") && (!q || norm([j.Title, j.CustomerName, j.SiteName, j.Description].join(" ")).includes(q))).sort(byUrgency);
  return `
  <div class="bar"><h2>Scheduler</h2><span class="seg"><button class="${day ? "on" : ""}" data-sv="day">Day</button><button class="${day ? "" : "on"}" data-sv="week">Week</button></span>
    <button class="btn" data-sn="-1" aria-label="Previous">‹</button><button class="btn" data-sn="0">Today</button><button class="btn" data-sn="1" aria-label="Next">›</button>
    <input type="date" class="f" id="sdate" value="${f.date}" aria-label="Go to date"><b class="stitle">${esc(title)}</b><span class="grow"></span>
    ${[["team","All teams","Teams"],["branch","All branches","Branches"]].filter(([k, , l]) => pickList(l).length).map(([k, all, l]) => `<select class="f" data-ssel="${k}" aria-label="${all}"><option value="">${all}</option>${pickList(l).map(x => `<option ${x === f[k] ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>`).join("")}
    <button class="btn" id="refresh">↻ Refresh</button><button class="btn primary" data-snew="">+ Booking</button></div>
  ${notSetUp(ROUTES.schedule.lists)}
  <div class="sched">
    <div><div class="sgrid">${grid}</div>
      <p class="count shelp">${day ? "Drag a job from the list onto a person and time. Drag a booking to move it; drag its right edge to change the finish. Click to edit." : "Drag a job onto a person and day (08:00 start; length from the job's estimate). Drag a booking to another person or day. Click to edit, or use the Day view to change times."}
        <span class="legend" style="display:inline-flex;margin-left:8px"><span><i class="lg p-high"></i>High</span><span><i class="lg p-urgent"></i>Urgent</span><span><i class="lg clash"></i>Clash</span><span><i class="lg warn"></i>Competency warning</span></span></p></div>
    <aside class="upanel">
      <div class="bar" style="margin-bottom:8px"><h3 style="margin:0">${f.all ? "Open jobs" : "Unscheduled jobs"}</h3><span class="grow"></span><span class="count">${cand.length}</span></div>
      <input type="search" id="sq" placeholder="Search jobs…" value="${esc(f.q)}" style="width:100%">
      <label class="chk" style="margin:8px 0"><span><input type="checkbox" id="sall" ${f.all ? "checked" : ""}> Show all open jobs (for extra days)</span></label>
      <div class="ulist">${cand.map(j => `<div class="ucard ${priClass(j)}" draggable="true" data-djob="${esc(j.Title)}" title="Drag onto the schedule">
        <div><b class="mono">${esc(j.Title)}</b> ${priPill(j.Priority)} ${j._st !== "New" ? jobPill(j._st) : ""}</div>
        <div class="count">${esc(j.CustomerName || "")}${j.SiteName ? " · " + esc(j.SiteName) : ""}</div>
        <div class="clip"><div>${esc(j.Description || "")}</div></div>
        <div class="count">${j.EstimatedHours ? esc(j.EstimatedHours) + " h est." : "no estimate"}${j.DueDate ? ` · due <span ${j.DueDate < TODAY ? 'style="color:var(--crit)"' : ""}>${fmtDate(j.DueDate)}</span>` : ""}</div></div>`).join("")
        || `<div class="empty">${f.all ? "No open jobs" : "Every job is booked"}</div>`}</div>
    </aside>
  </div>`;
}
function dayGrid(rows, date, book, jobs, hrs){
  const pct = m => (Math.min(Math.max(m, DAY_START), DAY_END) - DAY_START) / DAY_SPAN * 100;
  const hours = []; for (let h = DAY_START / 60; h <= DAY_END / 60; h++) hours.push(h);
  const nowM = date === TODAY ? (new Date().getHours() * 60 + new Date().getMinutes()) : null;
  const rowHtml = n => {
    const bs = book.filter(a => a.Technician === n).sort((a, b) => (a.StartTime || "").localeCompare(b.StartTime || ""));
    const lanes = []; bs.forEach(a => { const s = toMin(a.StartTime) ?? DAY_START; let i = lanes.findIndex(end => end <= s); if (i < 0) { i = lanes.length; lanes.push(0); } lanes[i] = toMin(a.EndTime) ?? DAY_END; a._lane = i; });
    const L = Math.max(1, lanes.length);
    return `<div class="dv-row"><div class="sname">${esc(n)}<span>${hrs(n)} h</span></div>
      <div class="dv-lane" data-drop="${esc(n)}|${date}" style="min-height:${Math.max(56, L * 44)}px">
      ${nowM != null && nowM >= DAY_START && nowM <= DAY_END ? `<i class="now" style="left:${pct(nowM)}%"></i>` : ""}
      ${bs.map(a => { const j = jobs.get(a.Title), s = toMin(a.StartTime) ?? DAY_START, e = toMin(a.EndTime) ?? s + 60, cl = clashes({ ...a, item:a }).length > 0;
        return `<div class="blk ${priClass(j)} ${cl ? "clash" : ""} ${a.CompetencyWarning ? "warn" : ""}" draggable="true" data-dbook="${esc(a.id)}" title="${esc(blockTitle(a, j, cl))}"
          style="left:${pct(s)}%;width:calc(${pct(e) - pct(s)}% - 2px);top:calc(${a._lane} * (100% / ${L}) + 4px);height:calc(100% / ${L} - 8px)">
          <span class="t mono">${esc(a.StartTime || "")}–${esc(a.EndTime || "")}</span> ${blockLabel(a, j)}<i class="rz" data-rz="${esc(a.id)}" title="Drag to change the finish time"></i></div>`; }).join("")}
      </div></div>`;
  };
  return `<div class="dv"><div class="dv-row dv-head"><div class="sname"></div><div class="dv-hours">${hours.map(h => `<span style="left:${pct(h * 60)}%">${pad(h)}:00</span>`).join("")}</div></div>${rows.map(rowHtml).join("")}</div>`;
}
function weekGrid(rows, from, book, jobs, hrs){
  const days = [...Array(7)].map((_, i) => addDays(from, i));
  return `<div class="wv"><div class="wh"></div>${days.map((d, i) => `<div class="wh ${d === TODAY ? "today" : ""} ${i > 4 ? "wkend" : ""}">${dayLabel(d)}</div>`).join("")}
    ${rows.map(n => `<div class="sname">${esc(n)}<span>${hrs(n)} h</span></div>${days.map((d, i) => {
      const bs = book.filter(a => a.Technician === n && a.AssignDate === d).sort((a, b) => (a.StartTime || "").localeCompare(b.StartTime || ""));
      return `<div class="wcell ${d === TODAY ? "today" : ""} ${i > 4 ? "wkend" : ""}" data-drop="${esc(n)}|${d}">${bs.map(a => { const j = jobs.get(a.Title), cl = clashes({ ...a, item:a }).length > 0;
        return `<div class="wblk ${priClass(j)} ${cl ? "clash" : ""} ${a.CompetencyWarning ? "warn" : ""}" draggable="true" data-dbook="${esc(a.id)}" title="${esc(blockTitle(a, j, cl))}"><span class="t mono">${esc(a.StartTime || "")}–${esc(a.EndTime || "")}</span><br>${blockLabel(a, j)}</div>`; }).join("")}</div>`; }).join("")}`).join("")}</div>`;
}

// ---- drag and drop
let DRAG = null;
async function dropBooking(tech, date, startMin){
  const d = DRAG; DRAG = null; if (!d) return;
  try {
    if (d.job){
      const j = jobByNo(d.job), start = startMin != null ? startMin : 8 * 60, startT = toHHMM(start), endT = defaultEnd(j, startT);
      const gaps = competencyGaps(tech, j, date);
      await saveRow("assign", null, { Title:j.Title, Technician:tech, AssignDate:date, StartTime:startT, EndTime:endT, AssignStatus:"Planned", CompetencyWarning: gaps.join("; ") });
      const cl = clashes({ Technician:tech, AssignDate:date, StartTime:startT, EndTime:endT, item: D.assign[D.assign.length - 1] });
      toast(`${j.Title} booked for ${tech} ${fmtDate(date)} ${startT}–${endT}${gaps.length ? " · ⚠ competency: " + gaps.join("; ") : ""}${cl.length ? " · ⛔ clashes with " + cl.map(x => x.Title).join(", ") : ""}`);
    } else {
      const a = D.assign.find(x => String(x.id) === d.book); if (!a) return;
      const s = toMin(a.StartTime) ?? 8 * 60, e = toMin(a.EndTime) ?? s + 60, ns = startMin != null ? startMin : s;
      const f = { Technician:tech, AssignDate:date, StartTime:toHHMM(ns), EndTime:toHHMM(Math.min(ns + (e - s), 23 * 60 + 45)) };
      if (f.Technician === a.Technician && f.AssignDate === a.AssignDate && f.StartTime === a.StartTime) return;
      const j = jobByNo(a.Title), gaps = competencyGaps(tech, j, date);
      await saveRow("assign", a, { ...f, CompetencyWarning: gaps.join("; ") });
      const cl = clashes({ ...a, item:a });
      toast(`Moved ${a.Title} to ${tech} ${fmtDate(date)} ${f.StartTime}–${f.EndTime}${gaps.length ? " · ⚠ competency" : ""}${cl.length ? " · ⛔ clash" : ""}`);
    }
  } catch(e){ toast(isForbidden(e) ? NO_PERMISSION : "Couldn't save the booking: " + e.message); }
  render();
}
function laneMinute(lane, clientX){
  const r = lane.getBoundingClientRect(), m = DAY_START + (clientX - r.left) / r.width * DAY_SPAN;
  return Math.min(Math.max(Math.round(m / SNAP) * SNAP, DAY_START), DAY_END - SNAP);
}
function bindSchedule(){
  if (S.route !== "schedule") return;
  const f = S.sf;
  document.querySelectorAll("[data-sv]").forEach(b => b.onclick = () => { f.view = b.dataset.sv; render(); });
  document.querySelectorAll("[data-sn]").forEach(b => b.onclick = () => { const n = +b.dataset.sn; f.date = n === 0 ? TODAY : addDays(f.date, n * (f.view === "day" ? 1 : 7)); render(); });
  const sd = $("#sdate"); if (sd) sd.onchange = () => { if (sd.value) { f.date = sd.value; render(); } };
  const sq = $("#sq"); if (sq) sq.oninput = () => { f.q = sq.value; const pos = sq.selectionStart; render(); const n = $("#sq"); n.focus(); n.setSelectionRange(pos, pos); };
  const sa = $("#sall"); if (sa) sa.onchange = () => { f.all = sa.checked; render(); };
  document.querySelectorAll("[data-ssel]").forEach(el => el.onchange = () => { f[el.dataset.ssel] = el.value; render(); });
  document.querySelectorAll("[data-snew]").forEach(b => b.onclick = () => openBooking(null, null, { AssignDate: f.date }));
  // drag sources
  document.querySelectorAll("[data-djob]").forEach(el => el.ondragstart = e => { DRAG = { job: el.dataset.djob }; e.dataTransfer.setData("text/plain", el.dataset.djob); e.dataTransfer.effectAllowed = "copy"; });
  document.querySelectorAll("[data-dbook]").forEach(el => {
    el.ondragstart = e => { if (RESIZING) { e.preventDefault(); return; } DRAG = { book: el.dataset.dbook, grabX: e.clientX - el.getBoundingClientRect().left }; e.dataTransfer.setData("text/plain", el.dataset.dbook); e.dataTransfer.effectAllowed = "move"; };
    el.onclick = e => { if (RESIZING || e.target.closest(".rz")) return; const a = D.assign.find(x => String(x.id) === el.dataset.dbook); if (a) openBooking(jobByNo(a.Title), a); };
  });
  // drop targets
  document.querySelectorAll("[data-drop]").forEach(z => {
    z.ondragover = e => { if (!DRAG) return; e.preventDefault(); z.classList.add("over"); };
    z.ondragleave = () => z.classList.remove("over");
    z.ondrop = e => { e.preventDefault(); z.classList.remove("over"); const [tech, date] = z.dataset.drop.split("|");
      let m = null;
      if (z.classList.contains("dv-lane")){ m = laneMinute(z, e.clientX);
        if (DRAG?.book && DRAG.grabX != null){ const el = document.querySelector(`[data-dbook="${CSS.escape(DRAG.book)}"]`); if (el) m = laneMinute(z, e.clientX - DRAG.grabX); } }
      dropBooking(tech, date, m); };
    // click an empty slot to book there
    z.onclick = e => { if (RESIZING || e.target !== z) return; const [tech, date] = z.dataset.drop.split("|");
      const m = z.classList.contains("dv-lane") ? laneMinute(z, e.clientX) : 8 * 60; openBooking(null, null, { Technician:tech, AssignDate:date, StartTime: toHHMM(m) }); };
  });
  // resize (day view): drag the right edge, snapped to 15 minutes
  document.querySelectorAll("[data-rz]").forEach(h => h.onpointerdown = e => {
    e.preventDefault(); e.stopPropagation(); RESIZING = true;
    const blk = h.parentElement, lane = blk.parentElement, a = D.assign.find(x => String(x.id) === h.dataset.rz), s = toMin(a.StartTime) ?? DAY_START;
    let endM = toMin(a.EndTime) ?? s + 60;
    const move = ev => { endM = Math.max(s + SNAP, laneMinute(lane, ev.clientX)); const r = lane.getBoundingClientRect();
      blk.style.width = `calc(${(endM - s) / DAY_SPAN * 100}% - 2px)`; blk.querySelector(".t").textContent = `${a.StartTime}–${toHHMM(endM)}`; };
    const up = async () => { document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up); setTimeout(() => RESIZING = false, 250);
      const endT = toHHMM(endM); if (endT === a.EndTime) return;
      try { await saveRow("assign", a, { EndTime:endT }); const cl = clashes({ ...a, item:a }); toast(`${a.Title}: ${a.Technician} now ${a.StartTime}–${endT}${cl.length ? " · ⛔ clash" : ""}`); }
      catch(err){ toast(isForbidden(err) ? NO_PERMISSION : "Couldn't save: " + err.message); }
      render(); };
    document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
  });
}
let RESIZING = false;

/* ---------------- boot ---------------- */
function showSignIn(msg){
  $("#main").innerHTML = `<div class="card signin"><div class="full">${mjeLogoFull(true)}</div><h2>Service Hub</h2><p>Quotes, jobs, scheduling and invoicing for ${esc(BRAND.COMPANY)}.</p>
    ${msg ? `<div class="banner err">${esc(msg)}</div>` : ""}<button class="btn primary" id="si">Sign in with Microsoft 365</button></div>`;
  $("#si").onclick = signIn;
}
// Names of every list on the site (one call), so screens can say "not set up" instead of failing
async function siteListNames(){
  let url = `/sites/${siteId}/lists?$select=name,displayName&$top=999`, out = new Set();
  while (url){ const j = await graph(url); j.value.forEach(l => { out.add(l.name); out.add(l.displayName); }); url = j["@odata.nextLink"]; }
  return out;
}
async function start(){
  mjeApplyBrand("Service Hub");
  mjeRenderApps("service");
  if (mjeAppState("service") === "off") { $("#main").innerHTML = mjeUnavailable("service"); return; }
  $("#dlgLogo").src = $(".logo .chip img").src;
  $("#dlgX").onclick = $("#dlgCancel").onclick = () => $("#dlg").close();
  $("#frm").onsubmit = submitForm;
  if (DEMO){
    account = { name:"Demo user", username:"demo@example.com" };
    Object.values(CONFIG.LISTS).forEach(n => S.have.add(n));
  } else {
    try { await initAuth(); } catch(e){ showSignIn("Sign-in error: " + e.message); return; }
    if (!account) return showSignIn();
    mjeRenderApps("service");                                 // preview Hubs need the sign-in email
    if (!mjeAppAllowed("service")) {
      $("#who").innerHTML = `<span class="nm">${esc(account.name || account.username)}</span><button id="so">Sign out</button>`; $("#so").onclick = signOut;
      $("#main").innerHTML = mjeUnavailable("service"); return;
    }
    try {
      await getSite();
      S.have = await siteListNames();
      if (S.have.has(CONFIG.LISTS.staff)) S.staff = await listItems(CONFIG.LISTS.staff);
    } catch(e){
      if (isNetErr(e) && loadSnapshot(true)){                       // no signal: open My Jobs from the copy on this phone
        [S.role, S.roleSource] = resolveRole(); await replayQueue(); await qCount(); readHash(); render(); return;
      }
      renderHeader();
      $("#main").innerHTML = `<div class="banner err">${isNetErr(e) ? "No connection — couldn't reach SharePoint." : "Couldn't load data from SharePoint: " + esc(e.message)}<br>Check the site ${esc(CONFIG.SP_HOST + CONFIG.SITE_PATH)} exists and you have access.</div>`;
      return;
    }
  }
  [S.role, S.roleSource] = resolveRole();
  readHash(); render();
  qCount().then(ops => { if (ops.length) flushSoon(2000); });     // anything left from last time
  if ("serviceWorker" in navigator && !DEMO && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(e => console.warn("Offline support not available:", e.message));
}
start();
